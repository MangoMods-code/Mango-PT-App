<title>Mango</title>
<script>
  // Apply the saved look before anything paints, so there's no flash of the wrong theme.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mango_look') || '{}'), d = document.documentElement;
      var theme = s.theme || 'mango';
      if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'mango';
      d.dataset.theme = theme; d.dataset.accent = s.accent || 'mango'; d.dataset.pl = s.plColors || 'classic';
      if (s.reduceMotion) d.dataset.motion = 'reduce';
      if (s.roundedNums === false) d.dataset.nums = 'plain';
      if (s.hideBalances) d.dataset.privacy = 'on';
    } catch (e) {}
  })();
</script>
<style>
/* ---------- design tokens ---------- */
:root {
  --bg: #120C1C; --bg2: #181024; --card: #1E1530; --card2: #281D3D; --card3: #322649;
  --line: #2E2443; --line2: #3F335A; --tx: #F7F2FF; --tx2: #CABFE0; --mu: #8E81A8; --mu2: #6D6187;
  --glass: rgba(24, 16, 36, .84); --scrim: rgba(6, 3, 12, .62);
  --up: #3DDC97; --dn: #FF5C77; --flat: #8E81A8;
  --ac: #FFB224; --ac2: #FF7A45; --ac-ink: #2B1500; --ac-soft: rgba(255, 178, 36, .14);
  --shadow: 0 18px 48px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .28);
  --hi: inset 0 1px 0 rgba(255, 255, 255, .05);
  --r-xl: 28px; --r-lg: 20px; --r: 16px; --r-sm: 12px; --r-xs: 9px;
  --gut: 16px; --nav-h: 64px; --page-max: 680px;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --ease-out: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.4, .64, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
[data-theme="midnight"] {
  --bg: #000; --bg2: #08060C; --card: #0F0B16; --card2: #18131F; --card3: #211A2B;
  --line: #1F1829; --line2: #2C2338; --glass: rgba(6, 4, 10, .86);
}
[data-theme="light"] {
  --bg: #F5F3F9; --bg2: #FFFFFF; --card: #FFFFFF; --card2: #EEEAF5; --card3: #E4DEEE;
  --line: #E6E0EF; --line2: #D7CFE4; --tx: #1A1326; --tx2: #4A3F5D; --mu: #82779A; --mu2: #A69CBB;
  --glass: rgba(255, 255, 255, .86); --scrim: rgba(26, 19, 38, .38);
  --up: #0E9F64; --dn: #E2344F;
  --shadow: 0 18px 44px rgba(40, 24, 70, .16), 0 2px 6px rgba(40, 24, 70, .08);
  --shadow-sm: 0 4px 14px rgba(40, 24, 70, .10);
  --hi: inset 0 1px 0 rgba(255, 255, 255, .8);
  color-scheme: light;
}
[data-accent="leaf"] { --ac: #3DDC97; --ac2: #1FB8A6; --ac-ink: #00291A; --ac-soft: rgba(61, 220, 151, .14); }
[data-accent="sky"] { --ac: #5AB8FF; --ac2: #7C83FF; --ac-ink: #001A33; --ac-soft: rgba(90, 184, 255, .14); }
[data-accent="grape"] { --ac: #B48CFF; --ac2: #FF6FD8; --ac-ink: #1E0A3D; --ac-soft: rgba(180, 140, 255, .15); }
[data-accent="rose"] { --ac: #FF7AA2; --ac2: #FF9F5A; --ac-ink: #3A0016; --ac-soft: rgba(255, 122, 162, .15); }
[data-theme="light"][data-accent="mango"] { --ac: #F7A21B; --ac2: #F2683A; --ac-soft: rgba(247, 162, 27, .14); }
[data-pl="colorblind"] { --up: #4EA8FF; --dn: #FF9F1C; }
[data-theme="light"][data-pl="colorblind"] { --up: #1F7FE0; --dn: #E07A00; }
[data-pl="reversed"] { --up: #FF5C77; --dn: #3DDC97; }
[data-theme="light"][data-pl="reversed"] { --up: #E2344F; --dn: #0E9F64; }
[data-nums="plain"] { --font-num: var(--font-ui); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font: 400 16px/1.42 var(--font-ui); letter-spacing: -.005em; overflow: hidden; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; touch-action: manipulation;
  transition: background-color .3s var(--ease);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
svg { display: block; }
input, textarea { -webkit-user-select: text; user-select: text; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--ac-soft); }
.hidden { display: none !important; }
.n, .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .dn { color: var(--dn); } .flat { color: var(--mu); }
.mu { color: var(--mu); } .tx2 { color: var(--tx2); }
.ac { color: var(--ac); }
.nowrap { white-space: nowrap; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.gap6 { gap: 6px; } .gap4 { gap: 4px; }
[data-privacy="on"] .priv { filter: blur(10px); transition: filter .25s; }
[data-privacy="on"] .priv:active { filter: none; }

/* type scale */
.t-display { font-family: var(--font-display); font-weight: 750; font-size: 34px; line-height: 1.08; letter-spacing: -.025em; font-variation-settings: "opsz" 60; }
.t-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.18; letter-spacing: -.02em; font-variation-settings: "opsz" 36; }
.t-head { font-weight: 650; font-size: 17px; line-height: 1.3; letter-spacing: -.012em; }
.t-body { font-size: 16px; }
.t-sub { font-size: 15px; color: var(--tx2); }
.t-foot { font-size: 13px; color: var(--mu); line-height: 1.35; }
.t-cap { font-size: 12px; color: var(--mu); }

/* ---------- app frame ---------- */
#app { position: fixed; inset: 0; }
#tabs { position: absolute; inset: 0; }
.tab {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  padding: calc(var(--safe-t) + 4px) calc(var(--gut) + var(--safe-r)) calc(var(--nav-h) + var(--safe-b) + 28px) calc(var(--gut) + var(--safe-l));
  visibility: hidden; opacity: 0; transform: scale(.985);
  transition: opacity .22s var(--ease), transform .3s var(--ease-out), visibility 0s linear .22s;
  scrollbar-width: none;
}
.tab::-webkit-scrollbar { display: none; }
.tab.on { visibility: visible; opacity: 1; transform: none; transition: opacity .26s var(--ease), transform .34s var(--ease-out), visibility 0s; }
.tab > .inner, .page-body > .inner { max-width: var(--page-max); margin: 0 auto; }

#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  padding: 6px max(10px, var(--safe-l)) calc(var(--safe-b) + 6px) max(10px, var(--safe-r));
  background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px);
  border-top: 1px solid var(--line);
}
.nav-logo { display: none; }
.nav-inner { display: flex; width: 100%; max-width: 520px; position: relative; }
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--mu);
  font-size: 11px; font-weight: 600; letter-spacing: .01em; position: relative; transition: color .2s var(--ease);
}
.nav-btn svg { width: 25px; height: 25px; transition: transform .35s var(--spring); }
.nav-btn.on { color: var(--tx); }
.nav-btn.on svg { transform: translateY(-1px) scale(1.06); color: var(--ac); }
.nav-btn:active svg { transform: scale(.88); }
.nav-dot { position: absolute; top: 3px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--dn); color: #fff; font-size: 10.5px; line-height: 16px; font-weight: 700; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.nav-glow { position: absolute; top: -7px; height: 2px; width: 28px; border-radius: 2px; background: linear-gradient(90deg, var(--ac), var(--ac2)); transition: transform .45s var(--spring); box-shadow: 0 0 12px var(--ac); }

/* ---------- top bars ---------- */
.topbar {
  position: sticky; top: calc(-1 * var(--safe-t) - 4px); z-index: 10; margin: 0 calc(-1 * var(--gut)); padding: calc(var(--safe-t) + 8px) var(--gut) 8px;
  display: flex; align-items: center; gap: 10px; min-height: calc(var(--safe-t) + 56px);
  transition: background .25s, border-color .25s; border-bottom: 1px solid transparent;
}
.scrolled .topbar { background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px); border-bottom-color: var(--line); }
.topbar .mini { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .3s var(--ease-out); pointer-events: none; }
.scrolled .topbar .mini { opacity: 1; transform: none; pointer-events: auto; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--tx);
  transition: transform .18s var(--ease), background .2s; position: relative; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { transform: scale(.9); background: var(--card3); }
.icon-btn .badge { position: absolute; top: -2px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--dn); color: #fff; font-size: 10.5px; line-height: 17px; font-weight: 700; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.large-title { margin: 6px 0 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: 14px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; white-space: nowrap;
  background: var(--card2); color: var(--tx); transition: transform .16s var(--ease), filter .2s, background .2s, opacity .2s; position: relative; overflow: hidden;
}
.btn svg { width: 19px; height: 19px; }
.btn:active { transform: scale(.965); filter: brightness(1.08); }
.btn[disabled], .btn.is-busy { opacity: .55; pointer-events: none; }
.btn-primary { background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-ink); box-shadow: 0 8px 22px -8px var(--ac); }
.btn-buy { background: var(--up); color: #00251A; box-shadow: 0 8px 22px -10px var(--up); }
.btn-sell { background: var(--dn); color: #fff; box-shadow: 0 8px 22px -10px var(--dn); }
[data-pl="colorblind"] .btn-buy { color: #001A33; } [data-pl="colorblind"] .btn-sell { color: #2B1600; }
[data-pl="reversed"] .btn-buy { color: #fff; } [data-pl="reversed"] .btn-sell { color: #00251A; }
.btn-ghost { background: transparent; color: var(--ac); }
.btn-quiet { background: var(--card2); }
.btn-danger { background: rgba(255, 92, 119, .14); color: var(--dn); }
.btn-lg { min-height: 54px; font-size: 17px; border-radius: 16px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn .spin { width: 18px; height: 18px; border: 2.4px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.btns { display: flex; gap: 10px; } .btns > .btn { flex: 1; }
.link { color: var(--ac); font-weight: 600; }

/* hold-to-confirm */
.hold { position: relative; touch-action: none; }
.hold .hold-fill { position: absolute; inset: 0; background: rgba(255, 255, 255, .28); transform-origin: left; transform: scaleX(0); pointer-events: none; }
.hold.holding .hold-fill { transform: scaleX(1); transition: transform var(--hold-ms, 650ms) linear; }
.hold .hold-label { position: relative; }

/* ---------- grouped lists ---------- */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 9px; }
.section-h h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.02em; font-variation-settings: "opsz" 32; }
.section-h .count { color: var(--mu); font-family: var(--font-num); font-weight: 600; margin-left: 6px; font-size: 17px; }
.section-h .more { color: var(--ac); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; }
.section-h .more svg { width: 16px; height: 16px; }
.group { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--hi); overflow: hidden; }
.group + .group { margin-top: 12px; }
.cell { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; position: relative; width: 100%; text-align: left; transition: background .15s; }
button.cell:active, a.cell:active, .cell.tap:active { background: var(--card2); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: var(--sep-l, 14px); right: 0; height: 1px; background: var(--line); }
.cell .lead { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--card2); color: var(--ac); }
.cell .lead svg { width: 19px; height: 19px; }
.cell .main { flex: 1; min-width: 0; }
.cell .title { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.cell .sub { font-size: 13px; color: var(--mu); margin-top: 1px; }
.cell .trail { text-align: right; flex: none; display: flex; align-items: center; gap: 8px; color: var(--tx2); }
.cell .chev { width: 17px; height: 17px; color: var(--mu2); flex: none; }
.cell.compact { min-height: 48px; padding-top: 9px; padding-bottom: 9px; }

/* asset rows */
.arow { --sep-l: 64px; }
.logo { width: 40px; height: 40px; border-radius: 12px; flex: none; position: relative; overflow: hidden; display: grid; place-items: center; font-weight: 750; font-size: 14px; letter-spacing: -.02em; color: #fff; }
.logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.logo.round { border-radius: 50%; }
.logo-sm { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.logo-lg { width: 52px; height: 52px; border-radius: 15px; font-size: 17px; }
.arow .sym { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.arow .qty { font-family: var(--font-num); font-weight: 600; font-size: 12.5px; color: var(--mu); }
.arow .name { font-size: 13px; color: var(--mu); }
.arow .spark { width: 64px; height: 30px; flex: none; }
.arow .val { font-family: var(--font-num); font-weight: 650; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 66px; height: 26px; padding: 0 8px; border-radius: 8px; font-family: var(--font-num); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill.up { background: color-mix(in srgb, var(--up) 15%, transparent); }
.pill.dn { background: color-mix(in srgb, var(--dn) 15%, transparent); }
.pill.flat { background: var(--card2); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--card2); color: var(--tx2); font-size: 11.5px; font-weight: 650; letter-spacing: .01em; }
.tag.ac { background: var(--ac-soft); color: var(--ac); }
.tag.up { background: color-mix(in srgb, var(--up) 14%, transparent); }
.tag.dn { background: color-mix(in srgb, var(--dn) 14%, transparent); }
.tag svg { width: 12px; height: 12px; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--up); display: inline-block; box-shadow: 0 0 0 0 var(--up); animation: pulse 2s infinite; }
.dot-off { width: 7px; height: 7px; border-radius: 50%; background: var(--mu2); display: inline-block; }

/* ---------- controls ---------- */
.seg { display: flex; position: relative; background: var(--card2); border-radius: 12px; padding: 3px; gap: 0; }
.seg button { flex: 1; position: relative; z-index: 1; height: 32px; border-radius: 9px; font-weight: 650; font-size: 14px; color: var(--tx2); transition: color .2s; white-space: nowrap; padding: 0 6px; }
.seg button.on { color: var(--tx); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 9px; background: var(--card3); box-shadow: var(--shadow-sm); transition: transform .38s var(--spring), width .38s var(--spring); }
[data-theme="light"] .seg .thumb { background: #fff; }
.seg.ranges { background: transparent; padding: 0; }
.seg.ranges button { height: 30px; font-size: 13.5px; color: var(--mu); }
.seg.ranges button.on { color: var(--ac-ink); }
.seg.ranges .thumb { top: 0; bottom: 0; background: linear-gradient(135deg, var(--ac), var(--ac2)); box-shadow: 0 4px 14px -6px var(--ac); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut); scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; background: var(--card2); color: var(--tx2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, transform .15s; scroll-snap-align: start; }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--tx); color: var(--bg); }
.chip svg { width: 15px; height: 15px; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--card3); position: relative; flex: none; transition: background .25s var(--ease); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); transition: transform .32s var(--spring); }
.switch.on { background: var(--up); }
.switch.on::after { transform: translateX(20px); }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--tx2); margin: 0 2px 6px; }
.input, .field input, .field select, .field textarea {
  width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--card2); font-size: 17px;
  transition: border-color .2s, box-shadow .2s, background .2s; -webkit-appearance: none; appearance: none;
}
.field textarea { height: 96px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ac); box-shadow: 0 0 0 4px var(--ac-soft); }
.field-row { display: flex; align-items: center; position: relative; }
.field-row input { flex: 1; padding-right: 48px; }
.field-eye { position: absolute; right: 6px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--mu); }
.field-eye svg { width: 20px; height: 20px; }
.money-in { position: relative; display: flex; align-items: center; }
.money-in .pre, .money-in .post { position: absolute; color: var(--mu); font-family: var(--font-num); font-weight: 650; font-size: 18px; pointer-events: none; }
.money-in .pre { left: 14px; } .money-in .post { right: 14px; }
.money-in input { font-family: var(--font-num); font-weight: 650; font-variant-numeric: tabular-nums; }
.money-in.has-pre input { padding-left: 30px; } .money-in.has-post input { padding-right: 58px; }

}

/* ---------- pages (slide in from the right) ---------- */

.page-body { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; padding: 0 calc(var(--gut) + var(--safe-r)) calc(var(--safe-b) + 40px) calc(var(--gut) + var(--safe-l)); margin-top: calc(-1 * (var(--safe-t) + 54px)); padding-top: calc(var(--safe-t) + 54px); scrollbar-width: none; }

.page-foot { position: relative; z-index: 2; padding: 10px calc(var(--gut) + var(--safe-r)) calc(var(--safe-b) + 10px) calc(var(--gut) + var(--safe-l)); background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px); border-top: 1px solid var(--line); }

/* ---------- sheets (slide up from the bottom) ---------- */

@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; border-radius: var(--r-xl); transform: translateY(-40%) scale(.96); opacity: 0; transition: transform .38s var(--ease-out), opacity .25s; max-height: min(86vh, 860px); } .sheet.in { transform: translateY(-50%); opacity: 1; } .sheet.tall { height: min(86vh, 860px); } .sheet-grab { display: none; } .sheet-head { padding-top: 16px; } .sheet-body, .sheet-foot { padding-bottom: 18px; } }

const IND_LABELS = { sma20: 'Moving average (20)', sma50: 'Moving average (50)', ema20: 'Exponential average (20)', bb: 'Bollinger bands', rsi: 'RSI (momentum)' };
function fmtStat(s) {
  const v = s.value;
  if (s.fmt === 'text') return h(v);
  if (s.fmt === 'cap') return '$' + compact(+v);
  if (s.fmt === 'big') return compact(+v);
  if (s.fmt === 'num') return (+v).toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (s.fmt === 'pct') return `<span class="${cls(+v)}">${pct(+v)}</span>`;
  if (s.fmt === 'pct0') return pct0(+v, 2);

      ${pos ? `<button class="cell" data-x="stop"><div class="lead">${icon('shield')}</div><div class="main"><div class="title">Stop loss or take profit</div><div class="sub">Protect your ${h(sym)} position</div></div>${icon('right', 'chev')}</button>` : ''}
      ${feature('games') && feature('preds') ? `<button class="cell" data-x="pred"><div class="lead">${icon('bull')}</div><div class="main"><div class="title">Bull vs Bear</div><div class="sub">Guess if it goes up or down</div></div>${icon('right', 'chev')}</button>` : ''}
      <button class="cell" data-x="copy"><div class="lead">${icon('copy')}</div><div class="main"><div class="title">Copy symbol</div></div></button></div>`,
    mount: s => s.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x; s.close(); await sleep(260);

// ===================================================================
// Trading: the trade ticket, stop loss / take profit, limit orders, alerts
// ===================================================================
const unitShort = sym => isCrypto(sym) ? sym : 'shares';
function fillPrice(sym, side) { const s = SET(), v = live(sym) || 0, slip = (s.slippage || 0) / 100; return side === 'buy' ? v * (1 + slip) : v * (1 - slip); }
const feeFor = total => { const s = SET(); return total > 0 ? (s.feeFlat || 0) + total * (s.feePct || 0) / 100 : 0; };
function maxBuyUsd(sym) {
  const s = SET(), cash = App.S.wallet.cash, px = fillPrice(sym, 'buy'); if (!px) return 0;
  let usd = (cash - (s.feeFlat || 0)) / (1 + (s.feePct || 0) / 100);
  if (s.wholeShares && !isCrypto(sym)) usd = Math.floor(usd / px) * px;
  return Math.max(0, Math.floor(usd * 100) / 100);
}
function marketNote(sym) {
  if (isCrypto(sym)) return '';
  const m = App.S.market; if (m.state === 'open') return '';
  const mode = SET().closedTrading;
  const when = m.opensAt ? new Date(m.opensAt).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : 'soon';
  if (mode === 'block') return `<div class="callout warn mt12">${icon('clock')}<div>The stock market is closed. It opens ${when}. You can change this in Settings → Trading.</div></div>`;
  if (mode === 'queue') return `<div class="callout mt12">${icon('clock')}<div>The market is closed, so this will be queued and fill when it opens (${when}).</div></div>`;
  return `<div class="callout mt12">${icon('clock')}<div>The market is closed. This fills right away at the last price, like a practice run.</div></div>`;
}

// ---------- the trade ticket ----------
ACT.trade = el => tradeSheet(el.dataset.sym, el.dataset.side || 'buy');
function tradeSheet(sym, side = 'buy', preset = {}) {
  if (!live(sym)) return toast(`No live price for ${sym} yet. Try again in a moment.`, { kind: 'err' });
  const s = SET(), st = { side, unit: preset.unit || 'usd', amount: preset.amount ?? (side === 'buy' && s.defaultBuy ? String(s.defaultBuy) : ''), sl: s.autoSL ? String(s.autoSL) : '', tp: s.autoTP ? String(s.autoTP) : '', trail: '', slType: 'pct', note: '', adv: !!(s.autoSL || s.autoTP) };
  const sh = sheet({ title: '', cls: 'ticket' });
  function pos() { return posOf(sym); }
  function calc() {
    const px = fillPrice(sym, st.side), a = num(st.amount), p = pos();
    let qty = 0;
    if (st.side === 'sell' && st.unit === 'pct') qty = p ? p.qty * Math.min(100, a) / 100 : 0;
    else if (st.unit === 'qty') qty = a;
    else qty = px ? a / px : 0;
    if (st.side === 'buy' && SET().wholeShares && !isCrypto(sym)) qty = Math.floor(qty + 1e-9);
    if (st.side === 'sell' && p && qty > p.qty) qty = p.qty;
    const total = qty * px, fee = feeFor(total);

    if (st.side === 'buy' && total + fee > cash + 0.005) err = `That's more than your ${money(cash)} buying power`;
    if (st.side === 'sell' && !p) err = `You don't own any ${sym}`;
    if (st.side === 'sell' && p && st.unit !== 'pct' && qty > p.qty + 1e-9) err = `You only have ${qtyStr(sym, p.qty)} ${unitShort(sym)}`;
    if (!(a > 0)) err = err || '';
    const pnl = st.side === 'sell' && p ? (px - p.avg) * qty - fee : null;
    const closedBlock = !isCrypto(sym) && App.S.market.state !== 'open' && SET().closedTrading === 'block';
    return { px, qty, total, fee, err, pnl, cashAfter: st.side === 'buy' ? cash - total - fee : cash + total - fee, ok: a > 0 && qty > 0 && !err && !closedBlock };
  }
  function draw() {

      ${p ? `<div class="side-toggle ${st.side}"><i class="thumb"></i><button class="b" data-side="buy">Buy</button><button class="s" data-side="sell">Sell</button></div>` : ''}

        <label class="field" style="margin:0"><span>Take profit</span><div class="money-in has-post"><input id="tk-tp" inputmode="decimal" placeholder="Off" value="${h(st.tp)}"><span class="post">% above</span></div></label></div>

  }
  function update() {

    const est = $('#tk-est', sh.body);
    if (est) est.innerHTML = `<div class="kv"><span class="k">Price${SET().slippage ? ' (with slippage)' : ''}</span><span class="v">${price(c.px)}</span></div>
      <div class="kv"><span class="k">${isCrypto(sym) ? 'Amount' : 'Shares'}</span><span class="v">${qtyStr(sym, c.qty)}</span></div>
      ${c.fee ? `<div class="kv"><span class="k">Fee</span><span class="v">${money(c.fee)}</span></div>` : ''}
      <div class="kv"><span class="k">${buy ? 'Total cost' : "You'll get"}</span><span class="v">${money(buy ? c.total + c.fee : c.total - c.fee)}</span></div>
      ${c.pnl != null && c.qty > 0 ? `<div class="kv"><span class="k">Profit / loss on this sale</span><span class="v ${cls(c.pnl)}">${money(c.pnl, { sign: true })}</span></div>` : ''}
      <div class="kv"><span class="k">Cash after</span><span class="v priv">${money(c.cashAfter)}</span></div>`;

// ---------- stop loss / take profit / trailing ----------
ACT.orderNew = el => orderSheet(el.dataset.sym, el.dataset.kind);
ACT.orderEdit = el => { const o = App.S.ord.find(x => x.id === +el.dataset.id); if (o) orderSheet(o.sym, o.kind === 'take' ? 'take' : 'stop', o); };
function orderSheet(sym, kind = 'stop', existing = null) {
  const p = posOf(sym); if (!p) return toast(`Buy ${sym} first, then protect it with a stop loss`, { kind: 'info' });
  const st = { kind, mode: existing?.kind === 'trail' ? 'trail' : 'px', val: existing ? (existing.kind === 'trail' ? String(existing.trail) : String(+existing.price.toFixed(existing.price < 1 ? 6 : 2))) : '', pct: existing?.pct || 100 };
  if (!existing) st.mode = 'cur';
  const sh = sheet({ title: existing ? 'Edit order' : kind === 'stop' ? 'Stop loss' : 'Take profit' });
  const modes = () => kind === 'stop' ? [['cur', '% below now'], ['avg', '% below cost'], ['px', 'Price'], ['usd', '$ loss'], ['trail', 'Trailing']] : [['cur', '% above now'], ['avg', '% above cost'], ['px', 'Price'], ['usd', '$ profit']];
  function trigger() {
    const v = num(st.val), now = live(sym), g = kind === 'stop' ? -1 : 1; if (!(v > 0)) return null;
    if (st.mode === 'px') return { price: v }; if (st.mode === 'cur') return { price: now * (1 + g * v / 100) };
    if (st.mode === 'avg') return { price: p.avg * (1 + g * v / 100) }; if (st.mode === 'usd') return { price: p.avg + g * v / p.qty };
    if (st.mode === 'trail') return { trail: v, price: now * (1 - v / 100) };
  }
  function draw() {
    const now = live(sym);
    if (existing && existing.kind === 'trail') st.mode = 'trail';
    sh.html(`<div class="row">${logo(sym, 'logo-sm')}<div class="grow"><div class="t-head">${h(sym)} · you own ${qtyStr(sym, p.qty)}</div><div class="t-foot">Now <span data-px="${h(sym)}">${price(now)}</span> · cost ${price(p.avg)}</div></div></div>
      <p class="t-foot" style="margin:12px 2px">${kind === 'stop' ? 'Sells automatically if the price drops to your level. It runs on the server, so it works even when your phone is off.' : 'Sells automatically when the price rises to your target, locking in the profit.'}</p>
      ${existing ? '' : `<div class="chips" style="flex-wrap:wrap;overflow:visible;margin:0;padding:0">${modes().map(([m, l]) => `<button class="chip ${st.mode === m ? 'on' : ''}" data-m="${m}">${l}</button>`).join('')}</div>`}
      <label class="field"><span>${st.mode === 'trail' ? 'Distance from the highest price' : st.mode === 'px' ? 'Trigger price' : st.mode === 'usd' ? (kind === 'stop' ? 'Most you want to lose' : 'Profit to lock in') : 'Percent'}</span>
        <div class="money-in ${st.mode === 'px' || st.mode === 'usd' ? 'has-pre' : 'has-post'}">${st.mode === 'px' || st.mode === 'usd' ? '<span class="pre">$</span>' : ''}<input id="os-v" inputmode="decimal" value="${h(st.val)}" placeholder="${st.mode === 'px' ? (+(now * (kind === 'stop' ? 0.95 : 1.1)).toFixed(now < 1 ? 6 : 2)) : st.mode === 'usd' ? '100' : st.mode === 'trail' ? '5' : kind === 'stop' ? '5' : '10'}">${st.mode === 'px' || st.mode === 'usd' ? '' : '<span class="post">%</span>'}</div></label>
      <div class="chips mt8" style="margin:8px 0 0;padding:0">${(st.mode === 'px' ? (kind === 'stop' ? [-2, -5, -10, -15] : [5, 10, 20, 50]) : st.mode === 'usd' ? [50, 100, 250, 500] : [2, 5, 10, 20]).map(x => `<button class="chip" data-f="${x}">${st.mode === 'px' ? (x > 0 ? '+' : '') + x + '%' : st.mode === 'usd' ? '$' + x : x + '%'}</button>`).join('')}</div>
      <div class="field"><span>How much to sell when it triggers</span>${seg('osp', [[25, '25%'], [50, '50%'], [75, '75%'], [100, 'All']], st.pct)}</div>
      <div class="card mt16" id="os-prev" style="background:var(--card2)"></div>
      <p class="dn center mt8" id="os-err" style="font-weight:600;min-height:20px;margin-bottom:0"></p>`);
    sh.foot(`<div class="btns">${existing ? `<button class="btn btn-danger btn-lg" id="os-del">${icon('trash')}Cancel order</button>` : ''}<button class="btn btn-primary btn-lg" id="os-go">${existing ? 'Save' : 'Set ' + (kind === 'stop' ? (st.mode === 'trail' ? 'trailing stop' : 'stop loss') : 'take profit')}</button></div>`);
    raf(() => placeThumbs(sh.body));
    const inp = $('#os-v', sh.body); inp.addEventListener('input', () => { st.val = inp.value; prev(); });
    sh.body.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { st.mode = b.dataset.m; st.val = ''; draw(); }));
    sh.body.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { const f = +b.dataset.f; st.val = st.mode === 'px' ? String(+(live(sym) * (1 + f / 100)).toFixed(live(sym) < 1 ? 6 : 2)) : String(f); inp.value = st.val; prev(); }));
    onSeg(sh.body, 'osp', v => { st.pct = +v; prev(); });
    $('#os-go', sh.footEl).addEventListener('click', save);
    const dl = $('#os-del', sh.footEl); if (dl) dl.addEventListener('click', async () => { try { await del('order/' + existing.id); toast('Order cancelled'); sh.close(); reload(); } catch (e) { toastErr(e); } });
    prev();
  }
  function prev() {
    const t = trigger(), box = $('#os-prev', sh.body), now = live(sym); if (!box) return;

    if (!t) { box.innerHTML = '<div class="t-foot">Enter a value to see what happens.</div>'; return; }

async function switchWallet(id) {
  if (id === App.W) return;
  App.W = id; store.set('wallet', id);
  try { await loadState(); rerenderAll(); VIEWS.portfolio.loadEq(); toast(`Switched to ${W().emoji} ${W().name}`); } catch (e) { toastErr(e); }
  if (VIEWS.activity.mounted) VIEWS.activity.reloadList();
}

    const F = [['f_watch', 'Watchlist', 'Star things to keep an eye on'], ['f_alerts', 'Price alerts', 'Notifications at your target prices'], ['f_analytics', 'Performance stats', 'Win rate, risk and results'], ['f_journal', 'Trade journal', 'Notes and tags on trades'], ['f_divs', 'Dividends', 'Get paid for holding dividend stocks'], ['f_news', 'News', 'Headlines on Market and asset pages'], ['f_earnings', 'Earnings calendar', 'Upcoming company reports'], ['f_insights', 'Analyst ratings and earnings', 'Extra research on stock pages'], ['f_heatmap', 'Heatmap', "See the whole market's day at a glance"], ['f_movers', 'Top movers', 'Biggest gainers and losers'], ['f_fng', 'Crypto mood', 'Fear and greed index'], ['f_book', 'Order book', 'Live buyers and sellers for crypto'], ['f_ext', 'Pre-market and after-hours prices', 'On stock pages'], ['f_games', 'Games tab', 'Levels, challenges and more'], ['f_preds', 'Bull vs Bear', 'Up or down prediction game'], ['f_leader', 'Leaderboard', 'Wallets vs the market'], ['f_achv', 'Achievements', 'Badges for milestones']];
    return `<p class="t-sub" style="margin:8px 2px 0">Everything is on by default. Turning something off only hides it. Nothing is deleted.</p><div class="group mt16">${F.map(([k, t, s]) => rowToggle(k, t, s)).join('')}</div>`;
  },
  data() {
    return `<div class="section-h"><h2>Export</h2></div><div class="group">
        <button class="cell" data-act="exportCsv"><div class="lead">${icon('download')}</div><div class="main"><div class="title">Trades as a spreadsheet</div><div class="sub">CSV file for ${h(W().emoji)} ${h(W().name)}</div></div></button>
        <button class="cell" data-act="backup"><div class="lead">${icon('database')}</div><div class="main"><div class="title">Full backup</div><div class="sub">Every wallet, trade, order and setting in one file</div></div></button></div>
      <div class="section-h"><h2>Restore</h2></div><div class="group"><label class="cell tap"><div class="lead">${icon('upload')}</div><div class="main"><div class="title">Restore from a backup file</div><div class="sub">Replaces everything with what's in the file</div></div><input type="file" accept="application/json,.json" id="restore-in" class="sr"></label></div>
      <div class="section-h"><h2>Start over</h2></div><div class="group">
        <button class="cell" data-act="resetWallet"><div class="lead" style="color:var(--dn)">${icon('refresh')}</div><div class="main"><div class="title">Reset ${h(W().name)}</div><div class="sub">Saves this season to the leaderboard first</div></div></button>
        <button class="cell" data-act="clearLocal"><div class="lead">${icon('phone')}</div><div class="main"><div class="title">Clear this device's cache</div><div class="sub">Fixes a stuck screen. You stay logged in.</div></div></button></div>`;
  },
  about() { return `<div class="card" id="status-box"><div class="sk sk-line"></div><div class="sk sk-line" style="width:70%"></div></div><button class="btn btn-quiet btn-block mt16" data-act="reloadApp">${icon('refresh')}Reload the app</button><p class="note">Stock prices come from Finnhub (free key) with history from Yahoo Finance. Crypto comes from Coinbase. News and research from Finnhub, crypto details from CoinGecko.</p>`; },
};
PAGES.settings.after = {
  notifications(p) {
    p.body.querySelectorAll('[data-time]').forEach(i => i.addEventListener('change', () => saveSetting({ [i.dataset.time]: i.value }).then(() => toast('Quiet hours saved'))));
    pushBox($('#push-box', p.body));
  },
  appearance(p) {
    p.body.querySelectorAll('[data-theme-pick]').forEach(b => b.addEventListener('click', () => saveSetting({ theme: b.dataset.themePick })));
    p.body.querySelectorAll('[data-accent-pick]').forEach(b => b.addEventListener('click', () => saveSetting({ accent: b.dataset.accentPick })));
    p.body.querySelectorAll('[data-pl-pick]').forEach(b => b.addEventListener('click', () => saveSetting({ plColors: b.dataset.plPick })));
  },
  data(p) {
    const inp = $('#restore-in', p.body);
    inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      let backup; try { backup = JSON.parse(await f.text()); } catch (e) { return toast("That file isn't a Mango backup", { kind: 'err' }); }
      if (backup.app !== 'mango') return toast("That file isn't a Mango backup", { kind: 'err' });
      const v = await askText({ title: 'Restore backup?', msg: `This replaces everything in Mango with the backup from ${fmtDT(backup.exported)}. Type RESTORE to confirm.`, placeholder: 'RESTORE', ok: 'Restore' });
      if (v !== 'RESTORE') return v !== null && toast('Type RESTORE in capitals to confirm', { kind: 'err' });
      try { await post('import', { backup, confirm: 'RESTORE' }); toast('Backup restored'); App.eqCache = {}; await loadState(); rerenderAll(); } catch (e) { toastErr(e); }
      inp.value = '';
    });
  },
  async about(p) {
    try {
      const s = await api('status'), box = $('#status-box', p.body); if (!box) return;
      const ago = t => t ? timeAgo(t) : 'never';
      box.innerHTML = `<div class="kv"><span class="k">Version</span><span class="v">${h(s.version)}</span></div>
        <div class="kv"><span class="k">Server running for</span><span class="v">${duration(s.up)}</span></div>
        <div class="kv"><span class="k">Crypto prices</span><span class="v ${s.feeds.crypto.ok ? 'up' : 'dn'}">${s.feeds.crypto.ok ? 'Live' : 'Reconnecting'} · ${ago(s.feeds.crypto.last)}</span></div>
        <div class="kv"><span class="k">Stock prices</span><span class="v ${s.finnhubKey ? (s.feeds.stocks.ok ? 'up' : 'dn') : 'mu'}">${s.finnhubKey ? (s.feeds.stocks.ok ? 'Connected' : 'Reconnecting') : 'No FINNHUB_KEY'}${s.finnhubKey ? ' · trade ' + ago(s.feeds.stocks.last) : ''}</span></div>
        <div class="kv"><span class="k">Live stock streams</span><span class="v">${s.feeds.stocks.subs.length} of ${s.wsMax}</span></div>
        <div class="kv"><span class="k">US market</span><span class="v">${h(s.market.state)}${s.market.holiday ? ' · ' + h(s.market.holiday) : ''}</span></div>
        <div class="kv"><span class="k">Things tracked</span><span class="v">${s.tracked}</span></div>
        <div class="kv"><span class="k">Saved history points</span><span class="v">${s.db.snaps.toLocaleString()}</span></div>
        <div class="kv"><span class="k">This device</span><span class="v ${App.wsOk ? 'up' : 'dn'}">${App.wsOk ? 'Live' : 'Offline'}</span></div>
        ${s.feeds.stocks.err ? `<div class="callout warn mt12">${icon('info')}<div>Stock feed says: ${h(s.feeds.stocks.err)}</div></div>` : ''}`;
    } catch (e) { const b = $('#status-box', p.body); if (b) b.innerHTML = `<div class="t-foot">${h(e.message)}</div>`; }
  },
};
ACT.backup = async () => {
  try { const r = await api('export?fmt=json', { raw: true }); if (!r.ok) throw new Error('Backup failed'); const blob = await r.blob(), url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = `mango-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Backup downloaded'); } catch (e) { toastErr(e); }
};
ACT.resetWallet = () => resetSheet(App.S.wallets.find(w => w.id === App.W) || W());
ACT.clearLocal = async () => { const t = App.T, w = App.W; try { Object.keys(localStorage).filter(k => k.startsWith('mango_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} setToken(t); store.set('wallet', w); try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {} toast('Cache cleared'); setTimeout(() => location.reload(), 700); };
ACT.reloadApp = () => location.reload();
ACT.logout = async () => { if (await confirmBox({ title: 'Log out?', msg: "You'll need your username and password to get back in on this device.", ok: 'Log out' })) logout(); };
ACT.logoutAll = async () => { if (!(await confirmBox({ title: 'Log out everywhere?', msg: 'Every phone and computer gets signed out. This device stays logged in.', ok: 'Log out everywhere', danger: true }))) return; try { const r = await post('logout-all'); setToken(r.token); connect(); toast('Every other device is logged out'); } catch (e) { toastErr(e); } };
ACT.changePass = () => {
  const s = sheet({ title: 'Change password', html: `<label class="field"><span>Current password</span><input type="password" id="cp-c" autocomplete="current-password"></label><label class="field"><span>New password</span><input type="password" id="cp-n" autocomplete="new-password"></label><label class="field"><span>New password again</span><input type="password" id="cp-n2" autocomplete="new-password"></label><p class="note">This replaces the APP_PASS from Railway. Other devices stay logged in.</p><p class="dn" id="cp-e" style="font-weight:600;min-height:20px"></p>`, foot: `<button class="btn btn-primary btn-lg btn-block" id="cp-go">Change password</button>`,
    mount: s => $('#cp-go', s.footEl).addEventListener('click', async () => {
      const c = $('#cp-c', s.body).value, n = $('#cp-n', s.body).value, n2 = $('#cp-n2', s.body).value, e = $('#cp-e', s.body);
      if (n !== n2) return e.textContent = "The new passwords don't match"; if (n.length < 6) return e.textContent = 'Use at least 6 characters';
      try { await post('password', { current: c, next: n }); toast('Password changed'); s.close(); } catch (x) { e.textContent = x.message; }
    }) });
  return s;
};

// ---------- push notifications on this device ----------
const b64u = s => { const r = atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
async function pushBox(el) {
  if (!el) return;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
    el.innerHTML = `<div class="t-head">Not available ${standalone ? 'on this device' : 'in the browser'}</div><p class="t-foot" style="margin:6px 0 0">${/iPhone|iPad/.test(navigator.userAgent) && !standalone ? 'On iPhone, notifications only work from the Home Screen app: tap Share, then Add to Home Screen, and open Mango from the icon. Needs iOS 16.4 or newer.' : 'This browser does not support web notifications.'}</p>`; return;
  }
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) {
      el.innerHTML = `<div class="between"><div><div class="t-head row gap6"><span class="dot-live"></span>On for this device</div><div class="t-foot">You'll get notifications even when Mango is closed.</div></div></div><div class="btns mt12"><button class="btn btn-quiet btn-sm" id="pb-test">${icon('bell')}Send a test</button><button class="btn btn-quiet btn-sm" id="pb-off">Turn off</button></div>`;
      $('#pb-test', el).addEventListener('click', async () => { try { const r = await post('push/test'); toast(`Test sent to ${r.sent} device${r.sent === 1 ? '' : 's'}`); } catch (e) { toastErr(e); } });
      $('#pb-off', el).addEventListener('click', async () => { try { await post('push/unsub', { endpoint: sub.endpoint }); await sub.unsubscribe(); toast('Notifications off for this device'); pushBox(el); } catch (e) { toastErr(e); } });
    } else {
      el.innerHTML = `<div class="t-head">Off on this device</div><p class="t-foot" style="margin:6px 0 12px">Turn them on to hear about fills, alerts and big moves even when the app is closed.</p><button class="btn btn-primary btn-block" id="pb-on">${icon('bell')}Turn on notifications</button>${Notification.permission === 'denied' ? '<p class="t-foot mt8">Notifications are blocked. On iPhone go to Settings → Notifications → Mango and allow them.</p>' : ''}`;
      $('#pb-on', el).addEventListener('click', async () => {
        try {
          if (await Notification.requestPermission() !== 'granted') return toast('Notifications are blocked', { kind: 'err', sub: 'Allow them in your phone settings for Mango.' });
          const key = App.S.push?.key || (await api('push/key')).key;
          const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) });
          await post('push/sub', { sub: s.toJSON() }); toast('Notifications are on'); pushBox(el);
        } catch (e) { toastErr(e); }
      });
    }
  } catch (e) { el.innerHTML = `<div class="t-foot">Notifications couldn't start here: ${h(e.message)}</div>`; }
}

// ===================================================================
// Start-up, login, service worker
// ===================================================================
let started = false;
function show(id) {
  for (const x of ['login', 'app']) $('#' + x).classList.toggle('hidden', x !== id);
  const sp = $('#splash'); if (sp && !sp.classList.contains('out')) { sp.classList.add('out'); setTimeout(() => sp.remove(), 700); }
}
function logout(silent) {
  setToken(null); store.del('cache'); App.S = null; started = false;
  try { App.ws && App.ws.close(); } catch (e) {}
  for (const l of Router.layers.splice(0)) { if (l.page) l.page.el.remove(); if (l.sheet) l.sheet.wrap.remove(); }
  for (const t of TABS) { const v = VIEWS[t]; if (v) v.mounted = false; $('#tab-' + t).innerHTML = ''; }
  show('login'); if (!silent) toast('Logged out');
  setTimeout(() => $('#login-u').focus(), 300);
}
function startApp() {
  if (started) { rerenderAll(); return; }
  started = true;
  applyLook(App.S.settings);
  App.tab = TABS.includes(SET().defaultTab) ? SET().defaultTab : 'portfolio';
  show('app');
  renderNav();
  setTab(App.tab);
  Router.init();
  connect();
  netStatus();
}
on('state', () => {
  if (!started) return;
  renderNav();
  const v = VIEWS[App.tab]; if (v?.mounted) v.update && v.update($('#tab-' + App.tab));
  for (const t of TABS) if (t !== App.tab && VIEWS[t]?.mounted) VIEWS[t].stale = true;
});
async function boot() {
  const minSplash = sleep(App.T && store.get('cache') ? 650 : 1100);
  if (!App.T) { await minSplash; show('login'); return; }
  const hadCache = loadCache();
  if (hadCache) { await minSplash; startApp(); loadState().catch(e => { if (e.status !== 401) netStatus(); }); return; }
  const status = $('#splash-status');
  const slow = setTimeout(() => { if (status) status.textContent = 'Connecting to live prices…'; }, 1800);
  try { await Promise.all([loadState(), minSplash]); clearTimeout(slow); startApp(); }
  catch (e) {
    clearTimeout(slow);
    if (e.status === 401) return;
    if (status) { status.innerHTML = `${h(e.message)} <button class="link" id="retry">Try again</button>`; $('#retry').onclick = () => location.reload(); }
  }
}
// ---------- login ----------
$('#login-eye').innerHTML = icon('eye');
$('#login-eye').addEventListener('click', () => { const p = $('#login-p'), on = p.type === 'password'; p.type = on ? 'text' : 'password'; $('#login-eye').innerHTML = icon(on ? 'eyeoff' : 'eye'); });
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#login-go'), err = $('#login-err'); err.textContent = '';
  const u = $('#login-u').value.trim(), p = $('#login-p').value;
  if (!u || !p) { err.textContent = 'Enter your username and password'; return; }
  busy(btn, true);
  try {
    const r = await api('login', { method: 'POST', body: { u, p } });
    setToken(r.token);
    await loadState();
  } catch (x) {
    busy(btn, false); err.textContent = x.message;
    const card = $('.login-card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); buzz(30);
    return;
  }
  busy(btn, false); $('#login-p').value = '';
  startApp();
});
// ---------- service worker (offline start and notifications) ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.nav && App.S) { const r = String(e.data.nav).replace(/^.*#\/?/, ''); if (r && r !== 'inbox') Router.go(r); else Router.go('inbox'); } });
}
// Desktop: little keyboard helpers
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey || !App.S) return;
  const top = Router.top();
  if (top?.page?.name === 'asset' && (e.key === 'b' || e.key === 's')) { if (e.key === 's' && !posOf(top.page.sym)) return; tradeSheet(top.page.sym, e.key === 'b' ? 'buy' : 'sell'); }
  if (!top && ['1', '2', '3', '4'].includes(e.key)) setTab(TABS[+e.key - 1]);
});
window.Mango = { App, Router, api, loadState, VIEWS, PAGES };
boot();

})();
</script>
