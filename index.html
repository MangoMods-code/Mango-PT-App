<title>Mango</title>
<script>
  // Apply the saved look before anything paints, so there's no flash of the wrong theme.
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mango_look') || '{}'), d = document.documentElement;
      var theme = s.theme || 'mango';
      if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'mango';
      d.dataset.theme = theme; d.dataset.accent = s.accent || 'mango'; d.dataset.pl = s.plColors || 'classic';
      if (s.reduceMotion) d.dataset.motion = 'reduce';
      if (s.roundedNums === false) d.dataset.nums = 'plain';
      if (s.hideBalances) d.dataset.privacy = 'on';
    } catch (e) {}
  })();
</script>
<style>
/* ---------- design tokens ---------- */
:root {
  --bg: #120C1C; --bg2: #181024; --card: #1E1530; --card2: #281D3D; --card3: #322649;
  --line: #2E2443; --line2: #3F335A; --tx: #F7F2FF; --tx2: #CABFE0; --mu: #8E81A8; --mu2: #6D6187;
  --glass: rgba(24, 16, 36, .84); --scrim: rgba(6, 3, 12, .62);
  --up: #3DDC97; --dn: #FF5C77; --flat: #8E81A8;
  --ac: #FFB224; --ac2: #FF7A45; --ac-ink: #2B1500; --ac-soft: rgba(255, 178, 36, .14);
  --shadow: 0 18px 48px rgba(0, 0, 0, .45), 0 2px 8px rgba(0, 0, 0, .3);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .28);
  --hi: inset 0 1px 0 rgba(255, 255, 255, .05);
  --r-xl: 28px; --r-lg: 20px; --r: 16px; --r-sm: 12px; --r-xs: 9px;
  --gut: 16px; --nav-h: 64px; --page-max: 680px;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --ease-out: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.4, .64, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
[data-theme="midnight"] {
  --bg: #000; --bg2: #08060C; --card: #0F0B16; --card2: #18131F; --card3: #211A2B;
  --line: #1F1829; --line2: #2C2338; --glass: rgba(6, 4, 10, .86);
}
[data-theme="light"] {
  --bg: #F5F3F9; --bg2: #FFFFFF; --card: #FFFFFF; --card2: #EEEAF5; --card3: #E4DEEE;
  --line: #E6E0EF; --line2: #D7CFE4; --tx: #1A1326; --tx2: #4A3F5D; --mu: #82779A; --mu2: #A69CBB;
  --glass: rgba(255, 255, 255, .86); --scrim: rgba(26, 19, 38, .38);
  --up: #0E9F64; --dn: #E2344F;
  --shadow: 0 18px 44px rgba(40, 24, 70, .16), 0 2px 6px rgba(40, 24, 70, .08);
  --shadow-sm: 0 4px 14px rgba(40, 24, 70, .10);
  --hi: inset 0 1px 0 rgba(255, 255, 255, .8);
  color-scheme: light;
}
[data-accent="leaf"] { --ac: #3DDC97; --ac2: #1FB8A6; --ac-ink: #00291A; --ac-soft: rgba(61, 220, 151, .14); }
[data-accent="sky"] { --ac: #5AB8FF; --ac2: #7C83FF; --ac-ink: #001A33; --ac-soft: rgba(90, 184, 255, .14); }
[data-accent="grape"] { --ac: #B48CFF; --ac2: #FF6FD8; --ac-ink: #1E0A3D; --ac-soft: rgba(180, 140, 255, .15); }
[data-accent="rose"] { --ac: #FF7AA2; --ac2: #FF9F5A; --ac-ink: #3A0016; --ac-soft: rgba(255, 122, 162, .15); }
[data-theme="light"][data-accent="mango"] { --ac: #F7A21B; --ac2: #F2683A; --ac-soft: rgba(247, 162, 27, .14); }
[data-pl="colorblind"] { --up: #4EA8FF; --dn: #FF9F1C; }
[data-theme="light"][data-pl="colorblind"] { --up: #1F7FE0; --dn: #E07A00; }
[data-pl="reversed"] { --up: #FF5C77; --dn: #3DDC97; }
[data-theme="light"][data-pl="reversed"] { --up: #E2344F; --dn: #0E9F64; }
[data-nums="plain"] { --font-num: var(--font-ui); }

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font: 400 16px/1.42 var(--font-ui); letter-spacing: -.005em; overflow: hidden; overscroll-behavior: none;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; touch-action: manipulation;
  transition: background-color .3s var(--ease);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
svg { display: block; }
input, textarea { -webkit-user-select: text; user-select: text; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; border-radius: 8px; }
::selection { background: var(--ac-soft); }
.hidden { display: none !important; }
.n, .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.up { color: var(--up); } .dn { color: var(--dn); } .flat { color: var(--mu); }
.mu { color: var(--mu); } .tx2 { color: var(--tx2); }
.ac { color: var(--ac); }
.nowrap { white-space: nowrap; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.gap6 { gap: 6px; } .gap4 { gap: 4px; }
[data-privacy="on"] .priv { filter: blur(10px); transition: filter .25s; }
[data-privacy="on"] .priv:active { filter: none; }

/* type scale */
.t-display { font-family: var(--font-display); font-weight: 750; font-size: 34px; line-height: 1.08; letter-spacing: -.025em; font-variation-settings: "opsz" 60; }
.t-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.18; letter-spacing: -.02em; font-variation-settings: "opsz" 36; }
.t-head { font-weight: 650; font-size: 17px; line-height: 1.3; letter-spacing: -.012em; }
.t-body { font-size: 16px; }
.t-sub { font-size: 15px; color: var(--tx2); }
.t-foot { font-size: 13px; color: var(--mu); line-height: 1.35; }
.t-cap { font-size: 12px; color: var(--mu); }

/* ---------- app frame ---------- */
#app { position: fixed; inset: 0; }
#tabs { position: absolute; inset: 0; }
.tab {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain;
  padding: calc(var(--safe-t) + 4px) calc(var(--gut) + var(--safe-r)) calc(var(--nav-h) + var(--safe-b) + 28px) calc(var(--gut) + var(--safe-l));
  visibility: hidden; opacity: 0; transform: scale(.985);
  transition: opacity .22s var(--ease), transform .3s var(--ease-out), visibility 0s linear .22s;
  scrollbar-width: none;
}
.tab::-webkit-scrollbar { display: none; }
.tab.on { visibility: visible; opacity: 1; transform: none; transition: opacity .26s var(--ease), transform .34s var(--ease-out), visibility 0s; }
.tab > .inner, .page-body > .inner { max-width: var(--page-max); margin: 0 auto; }

#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  padding: 6px max(10px, var(--safe-l)) calc(var(--safe-b) + 6px) max(10px, var(--safe-r));
  background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px);
  border-top: 1px solid var(--line);
}
.nav-logo { display: none; }
.nav-inner { display: flex; width: 100%; max-width: 520px; position: relative; }
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--mu);
  font-size: 11px; font-weight: 600; letter-spacing: .01em; position: relative; transition: color .2s var(--ease);
}
.nav-btn svg { width: 25px; height: 25px; transition: transform .35s var(--spring); }
.nav-btn.on { color: var(--tx); }
.nav-btn.on svg { transform: translateY(-1px) scale(1.06); color: var(--ac); }
.nav-btn:active svg { transform: scale(.88); }
.nav-dot { position: absolute; top: 3px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--dn); color: #fff; font-size: 10.5px; line-height: 16px; font-weight: 700; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.nav-glow { position: absolute; top: -7px; height: 2px; width: 28px; border-radius: 2px; background: linear-gradient(90deg, var(--ac), var(--ac2)); transition: transform .45s var(--spring); box-shadow: 0 0 12px var(--ac); }

/* ---------- top bars ---------- */
.topbar {
  position: sticky; top: calc(-1 * var(--safe-t) - 4px); z-index: 10; margin: 0 calc(-1 * var(--gut)); padding: calc(var(--safe-t) + 8px) var(--gut) 8px;
  display: flex; align-items: center; gap: 10px; min-height: calc(var(--safe-t) + 56px);
  transition: background .25s, border-color .25s; border-bottom: 1px solid transparent;
}
.scrolled .topbar { background: var(--glass); -webkit-backdrop-filter: saturate(170%) blur(22px); backdrop-filter: saturate(170%) blur(22px); border-bottom-color: var(--line); }
.topbar .mini { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .3s var(--ease-out); pointer-events: none; }
.scrolled .topbar .mini { opacity: 1; transform: none; pointer-events: auto; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--tx);
  transition: transform .18s var(--ease), background .2s; position: relative; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { transform: scale(.9); background: var(--card3); }
.icon-btn .badge { position: absolute; top: -2px; right: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--dn); color: #fff; font-size: 10.5px; line-height: 17px; font-weight: 700; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.large-title { margin: 6px 0 14px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px;
  border-radius: 14px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; white-space: nowrap;
  background: var(--card2); color: var(--tx); transition: transform .16s var(--ease), filter .2s, background .2s, opacity .2s; position: relative; overflow: hidden;
}
.btn svg { width: 19px; height: 19px; }
.btn:active { transform: scale(.965); filter: brightness(1.08); }
.btn[disabled], .btn.is-busy { opacity: .55; pointer-events: none; }
.btn-primary { background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-ink); box-shadow: 0 8px 22px -8px var(--ac); }
.btn-buy { background: var(--up); color: #00251A; box-shadow: 0 8px 22px -10px var(--up); }
.btn-sell { background: var(--dn); color: #fff; box-shadow: 0 8px 22px -10px var(--dn); }
[data-pl="colorblind"] .btn-buy { color: #001A33; } [data-pl="colorblind"] .btn-sell { color: #2B1600; }
[data-pl="reversed"] .btn-buy { color: #fff; } [data-pl="reversed"] .btn-sell { color: #00251A; }
.btn-ghost { background: transparent; color: var(--ac); }
.btn-quiet { background: var(--card2); }
.btn-danger { background: rgba(255, 92, 119, .14); color: var(--dn); }
.btn-lg { min-height: 54px; font-size: 17px; border-radius: 16px; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn-block { width: 100%; }
.btn .spin { width: 18px; height: 18px; border: 2.4px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
.btns { display: flex; gap: 10px; } .btns > .btn { flex: 1; }
.link { color: var(--ac); font-weight: 600; }

/* hold-to-confirm */
.hold { position: relative; touch-action: none; }
.hold .hold-fill { position: absolute; inset: 0; background: rgba(255, 255, 255, .28); transform-origin: left; transform: scaleX(0); pointer-events: none; }
.hold.holding .hold-fill { transform: scaleX(1); transition: transform var(--hold-ms, 650ms) linear; }
.hold .hold-label { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

/* ---------- grouped lists ---------- */
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 2px 9px; }
.section-h h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.02em; font-variation-settings: "opsz" 32; }
.section-h .count { color: var(--mu); font-family: var(--font-num); font-weight: 600; margin-left: 6px; font-size: 17px; }
.section-h .more { color: var(--ac); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 2px; }
.section-h .more svg { width: 16px; height: 16px; }
.group { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--hi); overflow: hidden; }
.group + .group { margin-top: 12px; }
.cell { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; position: relative; width: 100%; text-align: left; transition: background .15s; }
button.cell:active, a.cell:active, .cell.tap:active { background: var(--card2); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: var(--sep-l, 14px); right: 0; height: 1px; background: var(--line); }
.cell .lead { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--card2); color: var(--ac); }
.cell .lead svg { width: 19px; height: 19px; }
.cell .main { flex: 1; min-width: 0; }
.cell .title { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.cell .sub { font-size: 13px; color: var(--mu); margin-top: 1px; }
.cell .trail { text-align: right; flex: none; display: flex; align-items: center; gap: 8px; color: var(--tx2); }
.cell .chev { width: 17px; height: 17px; color: var(--mu2); flex: none; }
.cell.compact { min-height: 48px; padding-top: 9px; padding-bottom: 9px; }

/* asset rows */
.arow { --sep-l: 64px; }
.logo { width: 40px; height: 40px; border-radius: 12px; flex: none; position: relative; overflow: hidden; display: grid; place-items: center; font-weight: 750; font-size: 14px; letter-spacing: -.02em; color: #fff; }
.logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.logo.round { border-radius: 50%; }
.logo-sm { width: 30px; height: 30px; border-radius: 9px; font-size: 11px; }
.logo-lg { width: 52px; height: 52px; border-radius: 15px; font-size: 17px; }
.arow .sym { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.arow .qty { font-family: var(--font-num); font-weight: 600; font-size: 12.5px; color: var(--mu); }
.arow .name { font-size: 13px; color: var(--mu); }
.arow .spark { width: 64px; height: 30px; flex: none; }
.arow .val { font-family: var(--font-num); font-weight: 650; font-size: 16px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 66px; height: 26px; padding: 0 8px; border-radius: 8px; font-family: var(--font-num); font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pill.up { background: color-mix(in srgb, var(--up) 15%, transparent); }
.pill.dn { background: color-mix(in srgb, var(--dn) 15%, transparent); }
.pill.flat { background: var(--card2); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--card2); color: var(--tx2); font-size: 11.5px; font-weight: 650; letter-spacing: .01em; }
.tag.ac { background: var(--ac-soft); color: var(--ac); }
.tag.up { background: color-mix(in srgb, var(--up) 14%, transparent); }
.tag.dn { background: color-mix(in srgb, var(--dn) 14%, transparent); }
.tag svg { width: 12px; height: 12px; }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--up); display: inline-block; box-shadow: 0 0 0 0 var(--up); animation: pulse 2s infinite; }
.dot-off { width: 7px; height: 7px; border-radius: 50%; background: var(--mu2); display: inline-block; }

/* ---------- controls ---------- */
.seg { display: flex; position: relative; background: var(--card2); border-radius: 12px; padding: 3px; gap: 0; }
.seg button { flex: 1; position: relative; z-index: 1; height: 32px; border-radius: 9px; font-weight: 650; font-size: 14px; color: var(--tx2); transition: color .2s; white-space: nowrap; padding: 0 6px; }
.seg button.on { color: var(--tx); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 9px; background: var(--card3); box-shadow: var(--shadow-sm); transition: transform .38s var(--spring), width .38s var(--spring); }
[data-theme="light"] .seg .thumb { background: #fff; }
.seg.ranges { background: transparent; padding: 0; }
.seg.ranges button { height: 30px; font-size: 13.5px; color: var(--mu); }
.seg.ranges button.on { color: var(--ac-ink); }
.seg.ranges .thumb { top: 0; bottom: 0; background: linear-gradient(135deg, var(--ac), var(--ac2)); box-shadow: 0 4px 14px -6px var(--ac); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut); scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; background: var(--card2); color: var(--tx2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, transform .15s; scroll-snap-align: start; }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--tx); color: var(--bg); }
.chip svg { width: 15px; height: 15px; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--card3); position: relative; flex: none; transition: background .25s var(--ease); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); transition: transform .32s var(--spring); }
.switch.on { background: var(--up); }
.switch.on::after { transform: translateX(20px); }
.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--tx2); margin: 0 2px 6px; }
.input, .field input, .field select, .field textarea {
  width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--card2); font-size: 17px;
  transition: border-color .2s, box-shadow .2s, background .2s; -webkit-appearance: none; appearance: none;
}
.field textarea { height: 96px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ac); box-shadow: 0 0 0 4px var(--ac-soft); }
.field-row { display: flex; align-items: center; position: relative; }
.field-row input { flex: 1; padding-right: 48px; }
.field-eye { position: absolute; right: 6px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--mu); }
.field-eye svg { width: 20px; height: 20px; }
.money-in { position: relative; display: flex; align-items: center; }
.money-in .pre, .money-in .post { position: absolute; color: var(--mu); font-family: var(--font-num); font-weight: 650; font-size: 18px; pointer-events: none; }
.money-in .pre { left: 14px; } .money-in .post { right: 14px; }
.money-in input { font-family: var(--font-num); font-weight: 650; font-variant-numeric: tabular-nums; }
.money-in.has-pre input { padding-left: 30px; } .money-in.has-post input { padding-right: 58px; }

.a-head .nm { font-size: 14px; color: var(--mu); font-weight: 600; }
.a-head h1 { margin: 0; font-family: var(--font-display); font-weight: 750; font-size: 26px; letter-spacing: -.025em; line-height: 1.1; font-variation-settings: "opsz" 48; }
.a-price { font-family: var(--font-num); font-weight: 750; font-size: 40px; letter-spacing: -.035em; margin-top: 12px; height: 1.12em; line-height: 1.12em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.a-chg { font-family: var(--font-num); font-weight: 650; font-size: 15.5px; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.a-ext { font-size: 13.5px; color: var(--mu); margin-top: 4px; font-family: var(--font-num); }
.pos-card { background: linear-gradient(160deg, color-mix(in srgb, var(--ac) 12%, var(--card)), var(--card) 60%); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--hi); }
.pos-card .big { font-family: var(--font-num); font-weight: 750; font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 12px; }
.pos-grid .k { font-size: 12.5px; color: var(--mu); }
.pos-grid .v { font-family: var(--font-num); font-weight: 650; font-size: 15.5px; margin-top: 1px; font-variant-numeric: tabular-nums; }
.ratings { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
.ratings i { display: block; height: 100%; }
.eps { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding-top: 6px; }
.eps .q { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.eps .dots { position: relative; width: 100%; flex: 1; }
.eps .dot { position: absolute; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; }
.eps .dot.est { border: 2px dashed var(--mu); }
.eps .ql { font-size: 11.5px; color: var(--mu); font-weight: 600; }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; }
.book .bl { position: relative; display: flex; justify-content: space-between; padding: 3px 6px; border-radius: 5px; overflow: hidden; }
.book .bl i { position: absolute; top: 0; bottom: 0; right: 0; opacity: .16; }
.book .asks .bl i { left: 0; right: auto; }
.book .bl span { position: relative; }
.peers { display: flex; gap: 8px; flex-wrap: wrap; }
.trade-bar { display: flex; gap: 10px; }
.trade-bar .btn { flex: 1; }
.trade-bar .icon-btn { width: 54px; height: 54px; border-radius: 16px; }
.about { font-size: 15px; line-height: 1.5; color: var(--tx2); }
.about.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- trade ticket ---------- */
.side-toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--card2); border-radius: 14px; padding: 3px; position: relative; }
.side-toggle button { height: 40px; border-radius: 11px; font-weight: 700; font-size: 15.5px; position: relative; z-index: 1; color: var(--tx2); transition: color .2s; }
.side-toggle .thumb { position: absolute; top: 3px; bottom: 3px; width: calc(50% - 3px); border-radius: 11px; transition: transform .38s var(--spring), background .3s; }
.side-toggle.buy .thumb { background: var(--up); transform: translateX(0); }
.side-toggle.sell .thumb { background: var(--dn); transform: translateX(100%); }
.side-toggle.buy button.b, .side-toggle.sell button.s { color: #fff; }
.side-toggle.buy button.b { color: #00251A; }
.amount-box { text-align: center; padding: 18px 0 6px; }
.amount-box .unit-sw { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--ac); font-weight: 650; font-size: 14.5px; height: 30px; padding: 0 12px; border-radius: 15px; background: var(--ac-soft); }
.amount-box .unit-sw svg { width: 15px; height: 15px; }
.amount-box .eq { color: var(--mu); font-family: var(--font-num); font-size: 15px; margin-top: 8px; min-height: 22px; }
.quick-amts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.quick-amts .chip { justify-content: center; }
.est { background: var(--card); border-radius: var(--r); padding: 4px 14px; margin-top: 14px; }
.est .kv { font-size: 14.5px; padding: 8px 0; }
.adv-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 14px 2px; font-weight: 650; font-size: 15.5px; }
.adv-toggle svg { width: 18px; height: 18px; color: var(--mu); transition: transform .3s var(--ease); }
.adv-toggle.open svg { transform: rotate(180deg); }
.adv { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease-out); }
.adv.open { grid-template-rows: 1fr; }
.adv > div { overflow: hidden; padding: 0 4px; margin: 0 -4px; }
.two-in { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.success { text-align: center; padding: 18px 0 8px; }
.success .check { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); animation: pop .5s var(--spring) both; }
.success .check svg { width: 44px; height: 44px; }
.success .check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .25s var(--ease-out) forwards; }
.success h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.success p { color: var(--tx2); margin: 8px auto 0; max-width: 320px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 120; }
.dist { height: 6px; border-radius: 3px; background: var(--card3); position: relative; margin-top: 8px; overflow: hidden; }
.dist i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; background: var(--ac); transition: width .6s var(--ease-out); }

/* ---------- activity ---------- */
.day-h { font-size: 13px; font-weight: 700; color: var(--mu); margin: 18px 4px 7px; display: flex; justify-content: space-between; }
.act-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.act-ic svg { width: 19px; height: 19px; }
.act-ic.buy { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
.act-ic.sell { background: color-mix(in srgb, var(--dn) 15%, transparent); color: var(--dn); }
.act-ic.div, .act-ic.int { background: var(--ac-soft); color: var(--ac); }
.act-ic.cash { background: var(--card2); color: var(--tx2); }
.note-line { font-size: 13px; color: var(--tx2); margin-top: 4px; display: flex; gap: 6px; align-items: flex-start; }
.note-line svg { width: 13px; height: 13px; flex: none; margin-top: 2px; color: var(--mu); }

/* ---------- games ---------- */
.lvl { display: flex; align-items: center; gap: 16px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--ac) 26%, transparent), transparent 55%), var(--card); border-radius: var(--r-xl); padding: 18px; box-shadow: var(--hi); }
.lvl-ring { width: 84px; height: 84px; flex: none; position: relative; }
.lvl-ring svg { width: 100%; height: 100%; }
.lvl-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.lvl .t { font-family: var(--font-display); font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
.bvb { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bvb button { height: 92px; border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 750; font-size: 16px; transition: transform .2s var(--spring), box-shadow .2s; border: 2px solid transparent; }
.bvb button .em { font-size: 32px; line-height: 1; }
.bvb .bull { background: color-mix(in srgb, var(--up) 14%, var(--card)); color: var(--up); }
.bvb .bear { background: color-mix(in srgb, var(--dn) 14%, var(--card)); color: var(--dn); }
.bvb button.on { border-color: currentColor; transform: scale(1.03); }
.pred { display: flex; align-items: center; gap: 12px; }
.pred .clock { font-family: var(--font-num); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.lb-row .rank { width: 30px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--mu); flex: none; }
.lb-row.me { background: var(--ac-soft); }
.lb-row .em { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); font-size: 18px; flex: none; }
.ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ach { background: var(--card); border-radius: var(--r); padding: 14px 8px 12px; text-align: center; box-shadow: var(--hi); position: relative; }
.ach .ai { font-size: 30px; line-height: 1; height: 36px; display: grid; place-items: center; }
.ach .an { font-size: 12.5px; font-weight: 700; margin-top: 7px; line-height: 1.2; }
.ach .ad { font-size: 11px; color: var(--mu); margin-top: 3px; line-height: 1.25; }
.ach.locked .ai { filter: grayscale(1); opacity: .32; }
.ach.locked .an { color: var(--mu); }
.ach.new::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--ac); }
.chal { padding: 13px 14px; }
.chal + .chal { border-top: 1px solid var(--line); }
.chal .ct { display: flex; justify-content: space-between; gap: 10px; font-weight: 650; font-size: 15px; }
.chal .ct .n { font-family: var(--font-num); color: var(--mu); font-size: 13.5px; flex: none; }
.chal.done .ct span:first-child { color: var(--up); }
.chal .bar { margin-top: 9px; height: 6px; }

/* ---------- performance ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal div { aspect-ratio: 1; border-radius: 6px; background: var(--card2); position: relative; }
.cal div.has { cursor: pointer; }
.cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 10.5px; color: var(--mu); text-align: center; margin-bottom: 4px; font-weight: 650; }
.donut-wrap { display: flex; align-items: center; gap: 16px; }
.donut { width: 132px; height: 132px; flex: none; }
.donut-legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.donut-legend > div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.donut-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.donut-legend .p { margin-left: auto; font-family: var(--font-num); font-weight: 650; color: var(--tx2); }

/* ---------- wallets ---------- */
.wcard { border-radius: var(--r-lg); padding: 16px; position: relative; overflow: hidden; color: #fff; background: linear-gradient(140deg, var(--w1), var(--w2)); box-shadow: 0 14px 30px -18px var(--w1); text-align: left; width: 100%; display: block; }
.wcard + .wcard { margin-top: 10px; }
.wcard .wn { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.wcard .wv { font-family: var(--font-num); font-weight: 750; font-size: 28px; letter-spacing: -.02em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.wcard .wr { font-family: var(--font-num); font-weight: 650; font-size: 14px; opacity: .92; }
.wcard .wcheck { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, .25); display: grid; place-items: center; }
.wcard .wcheck svg { width: 15px; height: 15px; }
.wcard.archived { filter: grayscale(.8); opacity: .7; }
[data-wc="mango"] { --w1: #FFB224; --w2: #FA5256; }
[data-wc="leaf"] { --w1: #22C57E; --w2: #138A8A; }
[data-wc="sky"] { --w1: #4D9DFF; --w2: #6366F1; }
[data-wc="grape"] { --w1: #9B6BFF; --w2: #E254C6; }
[data-wc="rose"] { --w1: #FF6F96; --w2: #FF8A4C; }
[data-wc="slate"] { --w1: #5A5470; --w2: #2F2A3D; }
.color-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.color-pick button { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(140deg, var(--w1), var(--w2)); border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.color-pick button.on { border-color: var(--bg2); box-shadow: 0 0 0 2px var(--tx); }
.emoji-pick { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.emoji-pick button { aspect-ratio: 1; border-radius: 10px; font-size: 22px; background: var(--card2); }
.emoji-pick button.on { background: var(--ac-soft); box-shadow: inset 0 0 0 2px var(--ac); }

/* ---------- settings ---------- */
.set-hero { display: flex; align-items: center; gap: 14px; padding: 4px 2px 6px; }
.set-hero .av { width: 58px; height: 58px; border-radius: 18px; flex: none; }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.swatches button.on { border-color: var(--bg2); box-shadow: 0 0 0 2px var(--tx); }
.theme-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.theme-pick button { border-radius: 14px; padding: 6px; background: var(--card2); border: 2px solid transparent; font-size: 12.5px; font-weight: 650; color: var(--tx2); }
.theme-pick button.on { border-color: var(--ac); color: var(--tx); }
.theme-pick .pv { height: 56px; border-radius: 9px; margin-bottom: 6px; position: relative; overflow: hidden; }
.theme-pick .pv i { position: absolute; left: 8px; right: 8px; height: 6px; border-radius: 3px; }
.diag { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--tx2); white-space: pre-wrap; word-break: break-word; }

/* ---------- real-market trading ---------- */
.otypes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.otypes::-webkit-scrollbar { display: none; }
.otypes button { flex: none; height: 34px; padding: 0 11px; border-radius: 17px; font-size: 13.5px; font-weight: 650; color: var(--tx2); background: var(--card2); transition: background .25s var(--ease), color .25s; }
.otypes button.on { background: var(--tx); color: var(--bg); }
.quote-strip { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--card); }
.quote-strip > div { display: flex; flex-direction: column; gap: 1px; }
.quote-strip .r { align-items: flex-end; text-align: right; }
.quote-strip .k { font-size: 11.5px; color: var(--mu); font-weight: 600; }
.quote-strip b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.quote-strip > div:first-child b { color: var(--dn); } .quote-strip .r b { color: var(--up); }
.quote-strip .mid { align-items: center; text-align: center; }
.quote-strip .src { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 650; color: var(--mu); }
.quote-strip .src.live { color: var(--up); }
.kv.fee .k { display: flex; flex-direction: column; gap: 1px; }
.kv.fee small { font-size: 12px; color: var(--mu2); line-height: 1.3; }
.kv.total { font-weight: 700; } .kv.total .k { color: var(--tx); }
.money-banner { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 14px; background: color-mix(in srgb, var(--dn) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--dn) 45%, transparent); font-size: 14px; line-height: 1.35; margin-bottom: 4px; }
.money-banner svg { width: 18px; height: 18px; color: var(--dn); flex: none; }
.money-banner b { color: var(--dn); }
.real-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--dn); color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; }
/* buying power breakdown */
.bp-card { padding: 18px 16px 14px; }
.bp-card .big { font-family: var(--font-num); font-size: 34px; font-weight: 750; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--card2); margin: 14px 0 6px; gap: 2px; }
.stack i { display: block; height: 100%; min-width: 3px; }
.stack-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--mu); }
.stack-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--card2); margin: 12px 0 4px; overflow: visible; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.meter > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--tx); border-radius: 1px; }
.rule-pick { display: grid; gap: 8px; }
.rule-pick button { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 13px 14px; border-radius: var(--r-sm); background: var(--card2); border: 1.5px solid transparent; transition: border-color .2s, background .2s; }
.rule-pick button.on { border-color: var(--ac); background: var(--ac-soft); }
.rule-pick .t { font-weight: 700; font-size: 15px; }
.rule-pick .d { font-size: 13px; color: var(--mu); margin-top: 2px; line-height: 1.35; }
.rule-pick .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); flex: none; margin-top: 2px; }
.rule-pick button.on .dot { border-color: var(--ac); background: radial-gradient(circle, var(--ac) 45%, transparent 50%); }
.xfer-st { font-size: 12px; font-weight: 700; }
.lot-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; }
.lot-row + .lot-row { border-top: 1px solid var(--line); }
.tax-big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tax-big .tile .v { font-size: 22px; }

.steps { display: grid; gap: 12px; }
.step { display: flex; gap: 12px; align-items: flex-start; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--ac-soft); color: var(--ac); font-weight: 750; font-size: 13.5px; display: grid; place-items: center; flex: none; }
.step b { font-size: 15px; }

/* ---------- bots ---------- */
.bot-intro { background: radial-gradient(120% 120% at 100% 0, color-mix(in srgb, var(--ac) 16%, transparent), transparent 60%), var(--card); border-radius: var(--r-xl); padding: 20px 18px 18px; box-shadow: var(--hi); }
.bot-intro h3 { font-family: var(--font-display); font-size: 22px; letter-spacing: -.02em; margin: 12px 0 6px; }
.bot-intro p { color: var(--tx2); font-size: 14.5px; line-height: 1.45; margin: 0 0 16px; }
.bot-intro-art { width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-ink); }
.bot-intro-art svg { width: 30px; height: 30px; }
.bt-tiles { margin-bottom: 2px; }
.bot-list { display: flex; flex-direction: column; gap: 10px; }
.bot-card { display: block; width: 100%; text-align: left; background: var(--card); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--hi); transition: transform .15s; }
.bot-card:active { transform: scale(.985); }
.bot-top { display: flex; align-items: center; gap: 12px; }
.bot-top .main { flex: 1; min-width: 0; }
.bot-top .title { font-weight: 700; font-size: 16px; }
.bot-top .sub { font-size: 13px; color: var(--mu); margin-top: 1px; }
.bot-top .trail { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 15px; }
.bot-ava { width: 42px; height: 42px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--card3); color: var(--tx2); position: relative; }
.bot-ava svg { width: 22px; height: 22px; }
.bot-ava.running { background: var(--ac-soft); color: var(--ac); }
.bot-ava.killed { background: color-mix(in srgb, var(--dn) 14%, transparent); color: var(--dn); }
.bot-ava.lg { width: 56px; height: 56px; border-radius: 18px; }
.bot-ava.lg svg { width: 28px; height: 28px; }
.bot-meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--tx2); min-width: 0; }
.bot-meta .ellip { min-width: 0; }
.bot-meta .t-cap { flex: none; }
.bot-st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--mu); flex: none; }
.bot-st i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.bot-st.up { color: var(--up); } .bot-st.dn { color: var(--dn); }
.bot-st.up i { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 60%, transparent); animation: bot-pulse 2.4s infinite; }
@keyframes bot-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.bot-hero { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.bot-hero .t-display { font-size: 26px; line-height: 1.1; }
.bot-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bot-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meter-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--tx2); }
.meter-row + .meter { margin-top: 8px; height: 8px; }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.pf-grid .field small { display: block; margin: 4px 2px 0; }
.pf-wide { grid-column: 1 / -1; }

/* the thinking: one row per symbol, its action on a colored rail */
.think { display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; }
.think-head { font-weight: 700; font-size: 15.5px; margin-bottom: 6px; }
.think-risk { margin: 4px 0; display: flex; gap: 6px; align-items: flex-start; }
.think-risk svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.th-row { position: relative; padding: 10px 10px 10px 16px; border-radius: 12px; }
.th-row::before { content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--line2); }
.th-row.th-up::before { background: var(--up); } .th-row.th-dn::before { background: var(--dn); } .th-row.th-ac::before { background: var(--ac); }
.th-row.th-quiet { opacity: .62; }
.th-row + .th-row { border-top: 1px solid var(--line); border-radius: 0; }
.th-h { display: flex; align-items: center; gap: 8px; }
.th-h .logo-sm { width: 28px; height: 28px; font-size: 9px; }
.th-h b { font-size: 15px; }
.th-act { font-size: 12px; font-weight: 750; padding: 2px 8px; border-radius: 7px; background: var(--card2); color: var(--tx2); }
.th-up .th-act { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
.th-dn .th-act { background: color-mix(in srgb, var(--dn) 15%, transparent); color: var(--dn); }
.th-ac .th-act { background: var(--ac-soft); color: var(--ac); }
.th-w { margin-left: auto; font-size: 12.5px; color: var(--mu); font-family: var(--font-num); }
.th-note { margin: 6px 0 0; font-size: 13.5px; line-height: 1.42; color: var(--tx2); }
.th-why { margin: 5px 0 0; font-size: 13.5px; line-height: 1.42; color: var(--tx); font-weight: 550; }
.th-buzz { margin: 6px 0 0; display: flex; gap: 6px; font-size: 12.5px; line-height: 1.4; color: var(--mu); }
.th-buzz svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
.flag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.th-more { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; padding: 10px; font-size: 13px; color: var(--mu); font-weight: 600; border-top: 1px solid var(--line); }
.th-more svg { width: 14px; height: 14px; }
.log-risk .lead { color: var(--ac); } .log-error .lead { color: var(--dn); } .log-decision .lead { color: var(--ac); }

/* strategy picker: a row of cards to swipe through */
.strat-pick { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut) 6px; scrollbar-width: none; }
.strat-pick::-webkit-scrollbar { display: none; }
.strat { flex: none; width: min(78%, 300px); scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 14px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--hi), inset 0 0 0 1.5px transparent; transition: box-shadow .2s, transform .15s; }
.strat:active { transform: scale(.98); }
.strat.on { box-shadow: var(--hi), inset 0 0 0 2px var(--ac); background: radial-gradient(120% 90% at 0 0, var(--ac-soft), transparent 70%), var(--card); }
.strat-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--card2); color: var(--tx2); }
.strat.on .strat-ic { background: var(--ac); color: var(--ac-ink); }
.strat-ic svg { width: 20px; height: 20px; }
.strat-t { font-weight: 750; font-size: 16px; }
.strat-d { font-size: 13px; color: var(--tx2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.strat-m { font-size: 12px; color: var(--mu); margin-top: auto; }

/* backtest */
.bt-head { margin-top: 4px; }
.bt-big { font-family: var(--font-num); font-weight: 750; font-size: 36px; letter-spacing: -.03em; line-height: 1.1; margin: 2px 0 4px; }
.bt-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--mu); margin-top: 6px; }
.bt-legend span { display: inline-flex; align-items: center; gap: 6px; }
.bt-legend .ln { width: 16px; height: 2.5px; border-radius: 2px; background: var(--up); }
.bt-legend .ln.dash { background: repeating-linear-gradient(90deg, var(--tx2) 0 5px, transparent 5px 9px); }
.oos { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px 10px; align-items: baseline; font-size: 14px; }
.oos .n { font-family: var(--font-num); font-weight: 700; }
.month-grid { padding: 12px 10px; overflow-x: auto; }
.mg-row { display: grid; grid-template-columns: 38px repeat(12, minmax(18px, 1fr)) 44px; gap: 3px; align-items: center; min-width: 330px; }
.mg-row + .mg-row { margin-top: 3px; }
.mg-h span { font-size: 10.5px; color: var(--mu); text-align: center; }
.mg-c { height: 22px; border-radius: 5px; font-size: 9.5px; font-family: var(--font-num); display: grid; place-items: center; color: var(--tx); font-variant-numeric: tabular-nums; }
.mg-row > .n { font-size: 12px; text-align: right; font-weight: 700; }

/* news radar */
.mood { position: relative; display: block; width: 56px; height: 6px; border-radius: 3px; background: var(--card3); }
.mood::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1.5px; background: var(--mu2); }
.mood i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.mood i.up { background: var(--up); } .mood i.dn { background: var(--dn); }
.src-list { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--tx2); }
.src-list span { display: inline-flex; align-items: center; gap: 7px; }
.src-list i { width: 8px; height: 8px; border-radius: 50%; background: var(--mu2); }
.src-list .on i { background: var(--up); } .src-list .off i { background: var(--dn); }
.buzz-sum .bt-big { font-size: 28px; }
.cell .lead.ev-up { color: var(--up); } .cell .lead.ev-dn { color: var(--dn); } .cell .lead.ev-mu { color: var(--mu); }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--mu2); }
.sdot.up { background: var(--up); } .sdot.dn { background: var(--dn); }
.buzz-item { align-items: flex-start; }
.buzz-item .sdot { margin-top: 7px; }
.buzz-item .title { font-size: 14.5px; line-height: 1.35; white-space: normal; }
.buzz-mini { display: block; width: 100%; text-align: left; }
.buzz-line { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 13.5px; color: var(--tx2); min-width: 0; }
.buzz-line .ellip { flex: 1; min-width: 0; }
.buzz-line .t-cap { flex: none; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .bot-st.up i { animation: none; } }
[data-motion="reduce"] .bot-st.up i { animation: none; }

/* autopilot */
.auto-hero { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; margin-bottom: 4px; border-radius: var(--r-xl); background: radial-gradient(130% 140% at 0 0, color-mix(in srgb, var(--ac) 26%, transparent), transparent 62%), var(--card); box-shadow: var(--hi), inset 0 0 0 1px color-mix(in srgb, var(--ac) 30%, transparent); transition: transform .15s; }
.auto-hero:active { transform: scale(.985); }
.auto-hero .t { font-family: var(--font-display); font-weight: 750; font-size: 21px; letter-spacing: -.02em; }
.auto-hero .d { font-size: 13.5px; color: var(--tx2); line-height: 1.4; margin-top: 3px; }
.auto-hero .chev { width: 18px; height: 18px; color: var(--mu); flex: none; }
.auto-hero-ic { width: 48px; height: 48px; border-radius: 15px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, var(--ac), var(--ac2)); color: var(--ac-ink); }
.auto-hero-ic svg { width: 26px; height: 26px; }
.plan-stack { margin: 2px 0 12px; }
.plan-list { display: flex; flex-direction: column; gap: 8px; }
.plan-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--tx2); }
.plan-row > i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.plan-row b { color: var(--tx); }
.tryout .sub { white-space: normal; line-height: 1.4; }
.tryout:not(.on) .title { color: var(--tx2); }
.tryout .spark { flex: none; width: 64px; height: 28px; }

/* health, leaderboard, holds summary */
.health .t-foot { margin-top: 4px; color: var(--tx2); }
.health .link { margin-top: 8px; display: inline-block; }
.hdot { width: 9px; height: 9px; border-radius: 50%; background: var(--mu2); flex: none; }
.hdot.on { background: var(--up); } .hdot.off { background: var(--dn); }
.th-holds { display: flex; gap: 6px; margin: 8px 6px 2px; font-size: 13px; color: var(--mu); line-height: 1.4; }
.th-holds svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.plan-risk { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; color: var(--tx2); }
.plan-risk span { display: inline-flex; align-items: center; gap: 5px; }
.plan-risk svg { width: 14px; height: 14px; }
.bot-meta .tag svg { width: 12px; height: 12px; }
.lb-row { align-items: center; }
.lb-n { width: 22px; flex: none; font-family: var(--font-num); font-weight: 750; color: var(--mu); text-align: center; }
.lb-bars { display: flex; flex-direction: column; gap: 3px; margin: 6px 0 5px; }
.lb-bar { display: block; height: 5px; border-radius: 3px; min-width: 2px; }
.lb-bar.up { background: var(--up); } .lb-bar.dn { background: var(--dn); } .lb-bar.spy { background: var(--mu2); }
.bt-legend .ln.spy-ln { background: var(--mu2); }

/* strategy colors, sparklines, rename */
.bot-ava { --hue: var(--ac); }
.bot-ava.running { background: color-mix(in srgb, var(--hue) 16%, transparent); color: var(--hue); }
.bot-ava.paused { background: var(--card3); color: var(--mu); }
.strat { --hue: var(--ac); }
.strat.on { box-shadow: var(--hi), inset 0 0 0 2px var(--hue); background: radial-gradient(120% 90% at 0 0, color-mix(in srgb, var(--hue) 16%, transparent), transparent 70%), var(--card); }
.strat-ic { color: var(--hue); background: color-mix(in srgb, var(--hue) 12%, var(--card2)); }
.strat.on .strat-ic { background: var(--hue); color: #10091A; }
.bot-spark { width: 64px; height: 30px; flex: none; opacity: .9; }
.bot-name { display: inline-flex; align-items: center; gap: 8px; text-align: left; max-width: 100%; }
.bot-name svg { width: 16px; height: 16px; color: var(--mu); flex: none; }
.bot-name:active { opacity: .7; }
.lb-top { background: radial-gradient(120% 140% at 0 50%, color-mix(in srgb, var(--ac) 12%, transparent), transparent 60%); }
.lb-top .lb-n { font-size: 18px; }
.bot-meta .tag { flex: none; white-space: nowrap; }
.bot-meta .next-cap { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* plain-words status */
.bot-act { display: flex; gap: 9px; align-items: flex-start; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); min-width: 0; }
.bot-act > i { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--mu2); }
.bot-act.tone-up > i { background: var(--up); } .bot-act.tone-dn > i { background: var(--dn); } .bot-act.tone-ac > i { background: var(--ac); }
.bot-act.pulse > i { animation: bot-pulse 1.4s infinite; box-shadow: 0 0 0 0 color-mix(in srgb, var(--ac) 55%, transparent); }
.ba-t { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ba-t b { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
.ba-t span { font-size: 13px; color: var(--mu); line-height: 1.35; }
.bot-act.tone-dn b { color: var(--dn); }
.bot-act.big { margin: 0; padding: 12px 14px; border: 0; border-radius: var(--r); background: var(--card); box-shadow: var(--hi); }
.bot-act.big b { font-size: 16px; }
.bot-act.big > i { margin-top: 7px; }
.bot-card .bot-meta { margin-top: 8px; padding-top: 0; border-top: 0; }
.bot-card .bot-meta:not(:has(.tag)) .grow { display: none; }
.bot-next { display: flex; align-items: center; gap: 6px; margin: 8px 4px 0; }
.bot-next svg { width: 14px; height: 14px; }
@media (prefers-reduced-motion: reduce) { .bot-act.pulse > i { animation: none; } }

/* ---------- Paper / Alpaca sides ---------- */
.space-sw { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); box-shadow: var(--hi); margin: 2px 0 10px; }
.space-sw button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 650; color: var(--mu); transition: background .2s, color .2s; }
.space-sw button svg { width: 15px; height: 15px; }
.space-sw button.on { background: var(--card3); color: var(--tx); }
.space-sw button.on svg { color: var(--ac); }
.space-sw .real-badge { height: 16px; font-size: 9.5px; padding: 0 5px; }

/* The Alpaca side: calmer neutrals, a blue accent, and an always-on bar saying which account this is. */
[data-space="real"] {
  --bg: #0B0D12; --bg2: #10131A; --card: #151922; --card2: #1C212C; --card3: #262C39;
  --line: #222836; --line2: #303849; --tx: #F2F5FA; --tx2: #C3CAD8; --mu: #8790A3; --mu2: #5F687B;
  --glass: rgba(11, 13, 18, .88);
  --ac: #5AB8FF; --ac2: #3D7BFF; --ac-ink: #00142B; --ac-soft: rgba(90, 184, 255, .14);
  --bar-c: #2F6FE0;
  --safe-t: calc(env(safe-area-inset-top, 0px) + 30px);
}
[data-space="real"][data-live="1"] { --bar-c: #D8324B; }
[data-theme="light"][data-space="real"] {
  --bg: #F3F5F9; --bg2: #FFFFFF; --card: #FFFFFF; --card2: #EDF0F5; --card3: #E1E6EE;
  --line: #E2E7EF; --line2: #D2D9E4; --tx: #121722; --tx2: #3E4757; --mu: #758096; --mu2: #A1AABA;
  --glass: rgba(255, 255, 255, .88); --ac: #1F7FE0; --ac2: #1A5FD0; --ac-soft: rgba(31, 127, 224, .12);
}
#space-bar { display: none; }
[data-space="real"] #space-bar {
  display: flex; align-items: center; gap: 8px; position: fixed; z-index: 60; left: 0; right: 0; top: 0;
  padding: env(safe-area-inset-top, 0px) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l)); height: calc(env(safe-area-inset-top, 0px) + 30px);
  background: var(--bar-c); color: #fff; font-size: 11.5px; letter-spacing: .04em;
}
#space-bar b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#space-bar button, #space-bar .sb-halt { flex: none; white-space: nowrap; }
#space-bar .sb-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; flex: none; }
[data-live="1"] #space-bar .sb-dot { animation: sb-blink 1.6s infinite; }
@keyframes sb-blink { 50% { opacity: .35; } }
#space-bar .sb-halt { background: rgba(0, 0, 0, .28); padding: 2px 6px; border-radius: 5px; font-weight: 800; }
#space-bar button { height: 22px; padding: 0 9px; border-radius: 7px; background: rgba(255, 255, 255, .2); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { [data-live="1"] #space-bar .sb-dot { animation: none; } }
@media (min-width: 960px) { [data-space="real"] #nav { top: calc(env(safe-area-inset-top, 0px) + 30px); } }

/* Alpaca side with no account connected yet */
#real-gate { display: none; }
[data-gate] #real-gate { display: block; position: absolute; inset: 0; z-index: 20; overflow-y: auto; background: var(--bg); padding: calc(var(--safe-t) + 28px) calc(var(--gut) + var(--safe-r)) calc(var(--nav-h) + var(--safe-b) + 28px) calc(var(--gut) + var(--safe-l)); }
[data-gate] #real-gate .inner { max-width: 520px; margin: 0 auto; }
[data-gate] #tabs { visibility: hidden; }
.gate-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--ac-soft); color: var(--ac); margin-bottom: 14px; }
.gate-ic svg { width: 28px; height: 28px; }
#real-gate .t-display { margin: 0 0 6px; }

/* Alpaca controls */
.rc-head { margin-top: 8px; padding: 18px 16px 10px; border-radius: var(--r-xl); background: radial-gradient(120% 120% at 0 0, color-mix(in srgb, var(--bar-c, var(--ac)) 22%, transparent), transparent 65%), var(--card); box-shadow: var(--hi); }
.rc-eq { font-family: var(--font-num); font-weight: 750; font-size: 38px; letter-spacing: -.03em; margin: 2px 0; }

#login-face { margin-top: 10px; width: 100%; }
.login-or { text-align: center; font-size: 13px; color: var(--mu); margin: 8px 0 0; }

/* ---------- motion ---------- */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes fruit-in { 0% { transform: scale(.2) rotate(-40deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes leaf-in { 0% { transform: scale(0) rotate(-30deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes shake { 15%, 55% { transform: translateX(-9px); } 35%, 75% { transform: translateX(9px); } }
@keyframes flash-up { 0% { color: var(--up); text-shadow: 0 0 12px color-mix(in srgb, var(--up) 60%, transparent); } 100% { } }
@keyframes flash-dn { 0% { color: var(--dn); text-shadow: 0 0 12px color-mix(in srgb, var(--dn) 60%, transparent); } 100% { } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.shake { animation: shake .45s var(--ease); }
.flash-up { animation: flash-up .8s var(--ease-out); }
.flash-dn { animation: flash-dn .8s var(--ease-out); }
.bump { animation: bump .35s var(--spring); }
.rise { animation: rise .45s var(--ease-out) both; }
.stagger > * { animation: rise .45s var(--ease-out) both; }
.stagger > *:nth-child(2) { animation-delay: .03s; } .stagger > *:nth-child(3) { animation-delay: .06s; } .stagger > *:nth-child(4) { animation-delay: .09s; }
.stagger > *:nth-child(5) { animation-delay: .12s; } .stagger > *:nth-child(6) { animation-delay: .15s; } .stagger > *:nth-child(n+7) { animation-delay: .18s; }
[data-motion="reduce"] *, [data-motion="reduce"] *::before, [data-motion="reduce"] *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

/* ---------- bigger screens ---------- */
@media (min-width: 960px) {
  :root { --nav-h: 0px; --gut: 28px; --page-max: 760px; }
  #nav { top: 0; bottom: 0; right: auto; width: 92px; flex-direction: column; justify-content: flex-start; padding: 22px 8px; border-top: 0; border-right: 1px solid var(--line); }
  .nav-inner { flex-direction: column; gap: 6px; }
  .nav-btn { flex: none; padding: 12px 0 10px; border-radius: 14px; }
  .nav-btn:hover { background: var(--card); }
  .nav-glow { top: 0; left: -8px; width: 3px; height: 28px; }
  .nav-logo { display: block; width: 40px; height: 40px; margin: 0 auto 18px; }
  #tabs, #pages { left: 92px; }
  .tab { padding-bottom: 40px; }
  .page { box-shadow: none; border-left: 1px solid var(--line); }
  .chart-wrap { margin-left: 0; margin-right: 0; height: 260px; }
  .chart-wrap.tall { height: 340px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .idx-row { grid-template-columns: repeat(6, 1fr); }
  .ach-grid { grid-template-columns: repeat(5, 1fr); }
  .treemap { height: 380px; }
  .hero-val { font-size: 54px; }
  button:hover { filter: brightness(1.06); }
  .cell.tap:hover, button.cell:hover, a.cell:hover { background: var(--card2); }
}
@media (min-width: 1240px) {
  :root { --page-max: 1080px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .split > .side { position: sticky; top: 70px; }
}
@media (max-width: 370px) { .hero-val { font-size: 40px; } .quick { gap: 6px; } .ach-grid { grid-template-columns: repeat(2, 1fr); } }

  const render = () => list.map((s, i) => `<div class="cell arow">${logo(s, 'logo-sm')}<div class="main"><div class="sym">${h(s)}</div><div class="name ellip">${h(nameOf(s))}</div></div><button class="icon-btn" data-w="up" data-i="${i}" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>${icon('up')}</button><button class="icon-btn" data-w="down" data-i="${i}" ${i === list.length - 1 ? 'disabled style="opacity:.3"' : ''}>${icon('down')}</button><button class="icon-btn" data-w="del" data-i="${i}" style="color:var(--dn)">${icon('trash')}</button></div>`).join('');
  sheet({
    title: 'Edit watchlist', html: `<div class="group" id="we-list">${render()}</div>`,
    foot: `<button class="btn btn-primary btn-block" id="we-save">Done</button>`,
    mount: s => {
      s.body.addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; const i = +b.dataset.i; if (b.dataset.w === 'del') { list.splice(i, 1); } else { const j = b.dataset.w === 'up' ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; } $('#we-list', s.body).innerHTML = render(); });
      $('#we-save', s.footEl).addEventListener('click', async () => {
        const removed = App.S.watch.filter(x => !list.includes(x));
        try { for (const r of removed) await post('watch', { sym: r, on: false }); await post('watch/order', { syms: list }); App.S.watch = list; s.close(); reload(); toast('Watchlist saved'); } catch (e) { toastErr(e); }
      });
    },
  });
};

    let ctl = null, seq = 0;
    const idle = () => {
      const rec = store.get('recent', []).filter(Boolean).slice(0, 8);
      const S = App.S, pop = ['NVDA', 'AAPL', 'TSLA', 'BTC', 'ETH', 'SOL', 'AMZN', 'META', 'DOGE', 'SPY'];

        <p class="note">Search any US stock or ETF, or any crypto on Coinbase. Stocks trade during market hours. Crypto trades all day, every day.</p>`;

      } catch (e) { if (e.name !== 'AbortError' && my === seq) out.innerHTML = `<div class="empty"><h3>Search isn't working right now</h3><p>${h(e.message)}</p></div>`; }

    inp.addEventListener('input', () => { $('#sq-x', p.body).classList.toggle('hidden', !inp.value); run(inp.value.trim()); });
    $('#sq-x', p.body).addEventListener('click', () => { inp.value = ''; inp.focus(); $('#sq-x', p.body).classList.add('hidden'); idle(); });

  },

ACT.clearRecent = () => { store.set('recent', []); Router.top()?.page && PAGES.search.mount(Router.top().page); };
ACT.pick = async el => {
  const sym = el.dataset.sym, kind = el.dataset.kind;
  if (!A(sym) || !live(sym)) {
    el.classList.add('is-busy');
    try { const a = await post('track', { sym, kind }); if (App.S) App.S.assets[sym] = App.S.assets[sym] || { k: kind === 'crypto' ? 'c' : 's', n: a.name }; await loadState(); }
    catch (e) { el.classList.remove('is-busy'); return toastErr(e); }
  }
  Router.go('asset/' + sym);
};
function rememberSym(sym) { const r = store.get('recent', []).filter(x => x !== sym); r.unshift(sym); store.set('recent', r.slice(0, 10)); }

function fmtStat(s) {
  const v = s.value;
  if (s.fmt === 'text') return h(v);
  if (s.fmt === 'cap') return '$' + compact(+v);
  if (s.fmt === 'big') return compact(+v);
  if (s.fmt === 'num') return (+v).toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (s.fmt === 'pct') return `<span class="${cls(+v)}">${pct(+v)}</span>`;
  if (s.fmt === 'pct0') return pct0(+v, 2);
  return price(+v);
}

      <div class="field"><span>Over the next</span>${seg('pm', [[15, '15 min'], [60, '1 hour'], [240, '4 hours'], [1440, '1 day']].concat(stock ? [['close', 'Close']] : []), st.mins)}</div>
      ${closed ? `<div class="callout warn mt12">${icon('clock')}<div>The stock market is closed, so ${h(st.sym)} won't move. Pick a crypto, or try again when it opens.</div></div>` : `<p class="note">You win if ${h(st.sym)} is ${st.dir === 'up' ? 'higher' : 'lower'} than ${price(live(st.sym))} when time's up. Streaks earn bonus points.</p>`}`);
    sh.foot(`<button class="btn btn-primary btn-lg btn-block" id="pd-go" ${closed ? 'disabled' : ''}>${st.dir === 'up' ? '🐂 Call it: up' : '🐻 Call it: down'}</button>`);
    raf(() => placeThumbs(sh.body));
    sh.body.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => { st.sym = b.dataset.s; if (isCrypto(st.sym) && st.mins === 'close') st.mins = 60; draw(); }));
    sh.body.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { st.dir = b.dataset.d; draw(); }));

function nextRunText(t) {

// How a decision row reads: what it did, and the color that goes with it.
function rowAction(r) {
  if (r.action === 'buy') return ['Buy', 'up'];
  if (r.action === 'add') return ['Add', 'up'];

function btResults(r) {
  const B = r.benchSym || 'the benchmark', s = r.stats || {}, b = r.bench || {}, beat = s.ret != null && b.ret != null ? s.ret - b.ret : null;
  const tile = (k, v, sub = '', c = '') => `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  const rb = r.robust;
  const years = {}; for (const [m, v] of Object.entries(r.monthly || {})) { const [y, mm] = m.split('-'); (years[y] = years[y] || {})[+mm] = v; }
  const yearRet = y => Object.values(years[y]).reduce((t, v) => t * (1 + v), 1) - 1;
  const heat = v => v == null ? 'var(--card2)' : `color-mix(in srgb, var(--${v >= 0 ? 'up' : 'dn'}) ${Math.round(14 + 70 * Math.min(1, Math.abs(v) / 0.1))}%, var(--card2))`;
  return `<div class="bt-head"><div><div class="t-cap">${h(r.name)} · ${fmtDate(r.start + 'T12:00')} to ${fmtDate(r.end + 'T12:00')}</div><div class="bt-big ${cls(s.ret)}">${pctF(s.ret)}</div><div class="t-foot">${money(r.capital)} became <b class="priv">${money(s.end || 0)}</b>. Holding ${h(B)} did ${pctF(b.ret)}${beat != null ? `, so it ${beat >= 0 ? 'beat it by' : 'trailed it by'} ${pctA(beat)}` : ''}.</div></div></div>
    <div class="chart-wrap" id="bt-chart"></div><div class="bt-legend"><span><i class="ln"></i>Strategy</span><span><i class="ln dash"></i>Holding ${h(B)}</span></div>
    <div class="tiles mt12">${tile('Per year', pctF(s.cagr), `${h(B)}: ${pctF(b.cagr)}`, cls(s.cagr))}${tile('Biggest drop', pctA(s.maxDD), `${h(B)}: ${pctA(b.maxDD)}`, 'dn')}${tile('Sharpe ratio', s.sharpe == null ? '–' : s.sharpe.toFixed(2), `${h(B)}: ${b.sharpe == null ? '–' : b.sharpe.toFixed(2)}`)}${tile('Win rate', r.win == null ? '–' : pct0(r.win * 100, 0), `${r.round} round trips`)}${tile('Average win', pctF(r.avgWin), `Average loss ${pctF(r.avgLoss)}`, 'up')}${tile('Invested', pct0((r.exposure || 0) * 100, 0), 'Of the days')}${tile('Fees', money(r.fees), `Spread and slippage ${money(r.spreadCost)}`)}${tile('Trades', String(r.trades), r.avgDays != null ? `Held ${Math.round(r.avgDays)} days on average` : '')}</div>
    ${rb ? `<div class="section-h"><h2>Is it real or luck?</h2><span class="tag ${rb.pass ? 'up' : 'dn'}">${rb.pass ? 'Held up' : 'Weak'}</span></div><div class="card"><p class="t-sub" style="margin:0 0 10px">${h(rb.verdict)}</p>
      <div class="oos"><div></div><div class="t-cap">Tuning period</div><div class="t-cap">Unseen ${Math.round(r.years * 0.3 * 12)} months</div>
        <div class="t-foot">Your settings</div><div class="n ${cls(rb.inSample.yours?.ret)}">${pctF(rb.inSample.yours?.ret)}</div><div class="n ${cls(rb.outSample.yours?.ret)}">${pctF(rb.outSample.yours?.ret)}</div>
        <div class="t-foot">Best tuned</div><div class="n ${cls(rb.inSample.best?.ret)}">${pctF(rb.inSample.best?.ret)}</div><div class="n ${cls(rb.outSample.best?.ret)}">${pctF(rb.outSample.best?.ret)}</div>
        <div class="t-foot">Holding ${h(B)}</div><div class="n">–</div><div class="n ${cls(rb.outSample.bench?.ret)}">${pctF(rb.outSample.bench?.ret)}</div></div>
      <p class="note">Settings were tuned on the first 70% of the period (best: ${h(Object.entries(rb.tuned).map(([k, v]) => `${k} ${v}`).join(', '))}), then tested on the last 30%, which they never saw. Unseen results are the honest ones.</p></div>` : ''}
    <div class="section-h"><h2>Month by month</h2></div><div class="card month-grid"><div class="mg-row mg-h"><span></span>${'JFMAMJJASOND'.split('').map(x => `<span>${x}</span>`).join('')}<span>Year</span></div>
      ${Object.keys(years).sort().reverse().map(y => `<div class="mg-row"><span class="t-cap">${y}</span>${Array.from({ length: 12 }, (_, i) => { const v = years[y][i + 1]; return `<span class="mg-c" style="background:${heat(v)}" title="${v == null ? '' : pctF(v)}">${v == null ? '' : Math.round(v * 100) || 0}</span>`; }).join('')}<span class="n ${cls(yearRet(y))}">${pctF(yearRet(y), 0)}</span></div>`).join('')}</div>
    ${r.open?.length ? `<div class="section-h"><h2>What it would hold today</h2></div><div class="group">${r.open.map(o => `<div class="cell arow">${logo(o.sym, 'logo-sm')}<div class="main"><div class="sym">${h(o.sym)}</div><div class="name">since ${fmtDate(o.entryDate + 'T12:00')}</div></div><span class="val n ${cls(o.value - o.qty * o.entry)}">${pct((o.value / (o.qty * o.entry) - 1) * 100)}</span></div>`).join('')}</div>` : ''}
    ${r.recent?.length ? `<div class="section-h"><h2>Recent trades</h2></div><div class="group">${r.recent.slice(0, 12).map(t => `<div class="cell arow">${logo(t.sym, 'logo-sm')}<div class="main"><div class="sym">${h(t.sym)} <span class="t-cap">${t.why === 'stop' ? 'stop loss' : t.why}</span></div><div class="name">${fmtDate(t.entryDate + 'T12:00')} → ${fmtDate(t.exitDate + 'T12:00')} · ${t.days} days</div></div><span class="val n ${cls(t.pnl)}">${pct(t.ret * 100)}</span></div>`).join('')}</div>` : ''}
    ${r.missing?.length ? `<div class="callout warn mt12">${icon('info')}<div>No price history for ${h(r.missing.join(', '))}, so ${r.missing.length === 1 ? 'it was' : 'they were'} left out.</div></div>` : ''}
    ${r.shortHistory?.length ? `<p class="note">Shorter history: ${r.shortHistory.map(x => `${h(x.sym)} from ${fmtDate(x.from + 'T12:00')}`).join(', ')}.</p>` : ''}
    <p class="note">Daily prices adjusted for dividends and splits, decided at each close and filled at the close with half the bid–ask spread plus 0.02% slippage, and ${h(r.params && Object.keys(r.params).length ? 'the settings above' : 'no settings')}. Fees are the real ones for each date. A stop that gaps fills at the open. The news check can't be tested on the past, so live results will differ. Past results don't promise future ones.</p>`;
}

function bindPickers(root, pre, s, redraw, model) {
  root.addEventListener('click', e => {
    const sb = e.target.closest(`[data-pick="${pre}-strat"] .strat`);
    if (sb) { model.params = {}; model.syms = symList($(`#${pre}-syms`, root).value); if (sb.dataset.k === model.strategy) return; model.strategy = sb.dataset.k; if (model.uni !== 'custom' && STRAT_SYMS[model.strategy]) { model.syms = STRAT_SYMS[model.strategy].slice(); model.uni = 'suggested'; const ta = $(`#${pre}-syms`, root); if (ta) ta.value = model.syms.join(', '); } redraw(); return; }
    const u = e.target.closest('[data-uni]');
    if (u) { model.uni = u.dataset.uni; root.querySelectorAll('[data-uni]').forEach(x => x.classList.toggle('on', x === u)); if (u.dataset.uni !== 'custom') { model.syms = s.universes[u.dataset.uni].syms.slice(); $(`#${pre}-syms`, root).value = model.syms.join(', '); } else { const t = $(`#${pre}-syms`, root); t.focus(); } }
  });
  const t = $(`#${pre}-syms`, root); if (t) t.addEventListener('input', () => { if (model.uni !== 'custom') { model.uni = 'custom'; root.querySelectorAll('[data-uni]').forEach(x => x.classList.toggle('on', x.dataset.uni === 'custom')); } });
}

    if (!m.syms.length) { toast('Add at least one symbol for it to trade', { kind: 'err' }); return; }
    busy(btn, true);
    try {
      const wsel = (App.S.wallets || []).find(w => w.id === m.wallet); let confirm;
      if (wsel?.brokerEnv === 'live') { confirm = await askText({ title: 'Real money', msg: `This bot will place real-money orders on your Alpaca account, up to ${money(m.liveCap || 0)} invested. Type REAL MONEY to confirm.`, placeholder: 'REAL MONEY', ok: 'Confirm' }); if (confirm == null) { busy(btn, false); return; } }

      await loadState({ quiet: true });
      const f = r.first;
      toast(`${r.bot.name} is running`, { sub: r.deciding ? 'It\'s reading the news and making its first decision now.' : f?.error ? 'First decision: ' + f.error : f ? (f.orders.length ? f.orders.map(o => o.text).join('\n') : 'Its first decision: nothing to buy yet.') : nextRunText(r.bot.next) });
      history.back(); setTimeout(() => { Router.go('bot/' + r.bot.id); VIEWS.bots.load(); }, 120);
    } catch (e) { busy(btn, false); toastErr(e); }
  },
};

function autoSections(b) {
  const a = b.auto; if (!a) return '';
  const board = a.board.slice().sort((x, y) => (y.alloc || 0) - (x.alloc || 0) || y.score - x.score);
  const used = board.filter(t => t.alloc > 0), cash = Math.max(0, 1 - used.reduce((t, x) => t + x.alloc, 0));
  const COL = ['var(--ac)', 'var(--up)', '#5AB8FF', '#B48CFF', '#FF6F96', '#2EC4B6', '#F5C542', '#8D99FF'];
  const days = a.since ? Math.max(0, Math.round((Date.now() - Date.parse(a.since + 'T12:00:00')) / 864e5)) : 0;
  return `<div class="section-h"><h2>The plan</h2><span class="t-foot">${a.month ? 'For ' + new Date(a.month + '-15T12:00').toLocaleDateString('en-US', { month: 'long' }) : 'Not made yet'}</span></div>
    <div class="card">${used.length ? `<div class="stack plan-stack">${used.map((t, i) => `<i style="flex:${t.alloc};background:${COL[i % COL.length]}"></i>`).join('')}${cash > 0.005 ? `<i style="flex:${cash};background:var(--card3)"></i>` : ''}</div>
      <div class="plan-list">${used.map((t, i) => `<div class="plan-row"><i style="background:${COL[i % COL.length]}"></i><span class="grow">${h(t.label)}</span><b class="n">${Math.round(t.alloc * 100)}%</b></div>`).join('')}${cash > 0.005 ? `<div class="plan-row"><i style="background:var(--card3)"></i><span class="grow">Cash</span><b class="n">${Math.round(cash * 100)}%</b></div>` : ''}</div>` : `<p class="t-foot" style="margin:0">${a.board.length ? 'Holding cash: none of the strategies has a good enough record right now. It checks again every day.' : 'Its first plan shows up here after the first decision.'}</p>`}
      ${a.risk ? `<div class="plan-risk">${a.risk.vol != null ? `<span>${icon('activity')}Swinging ${Math.round(a.risk.vol * 100)}% a year${a.risk.scale < 0.999 ? ` · holding ${Math.round(a.risk.scale * 100)}% of the plan` : ''}</span>` : ''}${a.risk.stocksOff ? `<span class="dn">${icon('shield')}Safety switch on for stocks</span>` : ''}${a.risk.cryptoOff ? `<span class="dn">${icon('shield')}Safety switch on for crypto</span>` : ''}${a.risk.brake ? `<span class="dn">${icon('pause')}Brake on: holding half until it recovers</span>` : ''}</div>` : ''}
      ${a.report ? `<button class="link mt12" data-act="botReport" data-id="${a.report.id}">Read the ${h(a.report.title.toLowerCase())}</button>` : ''}</div>
    ${board.length ? `<div class="section-h"><h2>Tryouts</h2><span class="t-foot">${days ? `${days} day${days === 1 ? '' : 's'} live` : 'Live from today'}</span></div>

const isRealSpace = () => store.get('space') === 'real';

async function setSpace(sp) {
  if ((sp === 'real') === isRealSpace()) return;
  if (sp === 'real' && brokerW() && SET().faceReal !== false) { try { const n = (await api('passkey/available')).count; if (n) await faceStep(); } catch (e) { toastErr(e); return; } }

// Keep the open wallet on the current side.
function pickSpaceWallet() {
  const ws = App.S?.wallets || [];
  if (isRealSpace()) { const bw = brokerW(); if (bw) App.W = bw.id; }
  else if (W().broker || !ws.some(w => w.id === App.W)) { const pw = store.get('wallet:paper'), ok = ws.find(w => w.id === pw && !w.broker && !w.archived) || ws.find(w => w.id === SET().defaultWallet && !w.broker) || ws.find(w => !w.broker && !w.archived); if (ok) App.W = ok.id; }
  store.set('wallet', App.W);
}
function applySpace() {
  const real = isRealSpace(), bw = brokerW(), de = document.documentElement, halted = !!SET().realHalt;
  de.dataset.space = real ? 'real' : 'paper';
  de.dataset.live = real && bw?.brokerEnv === 'live' ? '1' : '0';
  de.toggleAttribute('data-gate', real && !bw);
  let bar = $('#space-bar');
  if (!bar) { bar = document.createElement('div'); bar.id = 'space-bar'; document.body.appendChild(bar); }
  bar.innerHTML = real ? `<span class="sb-dot"></span><b>${bw ? (bw.brokerEnv === 'live' ? 'ALPACA · REAL MONEY' : 'ALPACA · PAPER') : 'ALPACA · NOT CONNECTED'}</b>${halted ? '<span class="sb-halt">STOPPED</span>' : ''}<span class="grow"></span><button data-act="go" data-to="real">Controls</button><button data-act="space" data-sp="paper">Paper</button>` : '';
  let gate = $('#real-gate');
  if (real && !bw) {
    if (!gate) { gate = document.createElement('div'); gate.id = 'real-gate'; $('#app').appendChild(gate); }
    gate.innerHTML = `<div class="inner"><div class="gate-ic">${icon('lock')}</div><h1 class="t-display">Alpaca</h1><p class="t-sub">This side is for a real brokerage account: your Alpaca positions and orders, and only the bots you move here. No games, no practice wallets.</p><div class="card mt16" id="gate-box"><div class="sk sk-block"></div></div><button class="btn btn-quiet btn-block mt16" data-act="space" data-sp="paper">${icon('games')}Back to paper trading</button></div>`;
    brokerBox($('#gate-box', gate));
  } else if (gate) gate.remove();
}
on('state', () => {
  if (!App.S) return;
  const before = App.W; pickSpaceWallet(); applySpace();
  if (App.W !== before && !applySpace.busy) { applySpace.busy = true; loadState({ quiet: true }).catch(() => {}).finally(() => { applySpace.busy = false; }); }

const hasPasskeyApi = () => !!(window.PublicKeyCredential && navigator.credentials?.create);
const b64uEnc = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uDec = s => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; };
